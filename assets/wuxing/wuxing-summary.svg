<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
  <title id="t">五行戰術模組總結</title>
  <desc id="d">金木水火土五種教學能量的角色、功能、戰術武器與平衡提醒，加上先嚴後寬的課堂節奏及動態應變矩陣。</desc>
  <defs>
    <style>
      text { font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", "Heiti TC", sans-serif; }
      .glyph { font-family: "Noto Serif TC", "Songti TC", "PMingLiU", "Microsoft JhengHei", serif; fill: #fff; text-anchor: middle; }
      .h { font-weight: 700; fill: #2b2722; }
      .soft { fill: #6f685f; }
      .faint { fill: #958d82; }
      .lab { font-size: 14px; font-weight: 700; letter-spacing: 2px; }
      .item { font-size: 19px; }
      .chip { font-size: 16.5px; font-weight: 600; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="24" fill="#fbf8f3"/>
  <g fill="#3d3832">

  <!-- Header -->
  <text x="60" y="62" class="faint" font-size="15" letter-spacing="3">UNI+ 2.0 · 三維動態教學系統 V12 · X 軸</text>
  <text x="60" y="114" class="h" font-size="44">五行戰術模組<tspan class="soft" font-size="26" font-weight="400" dx="14">用什麼方式互動</tspan></text>
  <text x="1540" y="114" class="soft" font-size="20" text-anchor="end">KOC 承接情緒、激發動力的五種能量</text>

  <!-- Gold -->
  <g transform="translate(60,160)">
    <rect width="280" height="480" rx="18" fill="#fff" stroke="#c99a3b" stroke-opacity=".45" stroke-width="2"/>
    <path d="M0 18a18 18 0 0 1 18-18h244a18 18 0 0 1 18 18v132H0z" fill="#c99a3b" fill-opacity=".14"/>
    <circle cx="70" cy="75" r="46" fill="#c99a3b"/>
    <text x="70" y="91" class="glyph" font-size="46">金</text>
    <text x="132" y="68" class="h" font-size="26">Gold</text>
    <text x="132" y="100" class="soft" font-size="19">架構師 / 裁判</text>
    <text x="24" y="190" class="lab" fill="#a87b22">功能</text>
    <g class="item"><circle cx="30" cy="216" r="4" fill="#c99a3b"/><text x="44" y="222">建立標準</text>
      <circle cx="30" cy="246" r="4" fill="#c99a3b"/><text x="44" y="252">拆解難題</text>
      <circle cx="30" cy="276" r="4" fill="#c99a3b"/><text x="44" y="282">除錯 Debug</text></g>
    <text x="24" y="325" class="lab" fill="#a87b22">戰術武器</text>
    <g class="item"><circle cx="30" cy="351" r="4" fill="#c99a3b"/><text x="44" y="357">SOP 手術刀</text>
      <circle cx="30" cy="381" r="4" fill="#c99a3b"/><text x="44" y="387">陷阱雷達</text></g>
    <rect x="16" y="424" width="248" height="40" rx="20" fill="#c99a3b" fill-opacity=".14"/>
    <text x="140" y="450" class="chip" fill="#8a6414">太高壓 → 配 火 / 水</text>
  </g>

  <!-- Wood -->
  <g transform="translate(360,160)">
    <rect width="280" height="480" rx="18" fill="#fff" stroke="#4f9a5a" stroke-opacity=".45" stroke-width="2"/>
    <path d="M0 18a18 18 0 0 1 18-18h244a18 18 0 0 1 18 18v132H0z" fill="#4f9a5a" fill-opacity=".14"/>
    <circle cx="70" cy="75" r="46" fill="#4f9a5a"/>
    <text x="70" y="91" class="glyph" font-size="46">木</text>
    <text x="132" y="68" class="h" font-size="26">Wood</text>
    <text x="132" y="100" class="soft" font-size="19">園丁 / 導航員</text>
    <text x="24" y="190" class="lab" fill="#3a7a44">功能</text>
    <g class="item"><circle cx="30" cy="216" r="4" fill="#4f9a5a"/><text x="44" y="222">構建知識體系</text>
      <circle cx="30" cy="246" r="4" fill="#4f9a5a"/><text x="44" y="252">激發聯想</text>
      <circle cx="30" cy="276" r="4" fill="#4f9a5a"/><text x="44" y="282">舉一反三</text></g>
    <text x="24" y="325" class="lab" fill="#3a7a44">戰術武器</text>
    <g class="item"><circle cx="30" cy="351" r="4" fill="#4f9a5a"/><text x="44" y="357">思維導圖</text>
      <circle cx="30" cy="381" r="4" fill="#4f9a5a"/><text x="44" y="387">鷹架 Scaffolding</text></g>
    <rect x="16" y="424" width="248" height="40" rx="20" fill="#4f9a5a" fill-opacity=".14"/>
    <text x="140" y="450" class="chip" fill="#2f6838">易離題 → 用 金 修剪</text>
  </g>

  <!-- Water -->
  <g transform="translate(660,160)">
    <rect width="280" height="480" rx="18" fill="#fff" stroke="#3f8cc0" stroke-opacity=".45" stroke-width="2"/>
    <path d="M0 18a18 18 0 0 1 18-18h244a18 18 0 0 1 18 18v132H0z" fill="#3f8cc0" fill-opacity=".14"/>
    <circle cx="70" cy="75" r="46" fill="#3f8cc0"/>
    <text x="70" y="91" class="glyph" font-size="46">水</text>
    <text x="132" y="68" class="h" font-size="26">Water</text>
    <text x="132" y="100" class="soft" font-size="19">說書人 / 治療師</text>
    <text x="24" y="190" class="lab" fill="#2c6f9e">功能</text>
    <g class="item"><circle cx="30" cy="216" r="4" fill="#3f8cc0"/><text x="44" y="222">處理情緒</text>
      <circle cx="30" cy="246" r="4" fill="#3f8cc0"/><text x="44" y="252">建立共情</text>
      <circle cx="30" cy="276" r="4" fill="#3f8cc0"/><text x="44" y="282">價值重塑</text></g>
    <text x="24" y="325" class="lab" fill="#2c6f9e">戰術武器</text>
    <g class="item"><circle cx="30" cy="351" r="4" fill="#3f8cc0"/><text x="44" y="357">故事掛鉤</text>
      <circle cx="30" cy="381" r="4" fill="#3f8cc0"/><text x="44" y="387">情緒緩衝墊</text></g>
    <rect x="16" y="424" width="248" height="40" rx="20" fill="#3f8cc0" fill-opacity=".14"/>
    <text x="140" y="450" class="chip" fill="#225a82">易散漫 → 用 土 立規矩</text>
  </g>

  <!-- Fire -->
  <g transform="translate(960,160)">
    <rect width="280" height="480" rx="18" fill="#fff" stroke="#e0603a" stroke-opacity=".45" stroke-width="2"/>
    <path d="M0 18a18 18 0 0 1 18-18h244a18 18 0 0 1 18 18v132H0z" fill="#e0603a" fill-opacity=".14"/>
    <circle cx="70" cy="75" r="46" fill="#e0603a"/>
    <text x="70" y="91" class="glyph" font-size="46">火</text>
    <text x="132" y="68" class="h" font-size="26">Fire</text>
    <text x="132" y="100" class="soft" font-size="19">表演者 / 啦啦隊</text>
    <text x="24" y="190" class="lab" fill="#b8431f">功能</text>
    <g class="item"><circle cx="30" cy="216" r="4" fill="#e0603a"/><text x="44" y="222">搶奪注意力</text>
      <circle cx="30" cy="246" r="4" fill="#e0603a"/><text x="44" y="252">點燃動機</text>
      <circle cx="30" cy="276" r="4" fill="#e0603a"/><text x="44" y="282">打破沉悶</text></g>
    <text x="24" y="325" class="lab" fill="#b8431f">戰術武器</text>
    <g class="item"><circle cx="30" cy="351" r="4" fill="#e0603a"/><text x="44" y="357">高頻互動 Kahoot!</text>
      <circle cx="30" cy="381" r="4" fill="#e0603a"/><text x="44" y="387">視覺衝擊</text></g>
    <rect x="16" y="424" width="248" height="40" rx="20" fill="#e0603a" fill-opacity=".14"/>
    <text x="140" y="450" class="chip" fill="#a3391a">只玩不學 → 接 土 靜心</text>
  </g>

  <!-- Earth -->
  <g transform="translate(1260,160)">
    <rect width="280" height="480" rx="18" fill="#fff" stroke="#a57645" stroke-opacity=".45" stroke-width="2"/>
    <path d="M0 18a18 18 0 0 1 18-18h244a18 18 0 0 1 18 18v132H0z" fill="#a57645" fill-opacity=".14"/>
    <circle cx="70" cy="75" r="46" fill="#a57645"/>
    <text x="70" y="91" class="glyph" font-size="46">土</text>
    <text x="132" y="68" class="h" font-size="26">Earth</text>
    <text x="132" y="100" class="soft" font-size="19">建築師 / 守護者</text>
    <text x="24" y="190" class="lab" fill="#865a2c">功能</text>
    <g class="item"><circle cx="30" cy="216" r="4" fill="#a57645"/><text x="44" y="222">鞏固基礎</text>
      <circle cx="30" cy="246" r="4" fill="#a57645"/><text x="44" y="252">建立習慣</text>
      <circle cx="30" cy="276" r="4" fill="#a57645"/><text x="44" y="282">提供安全感</text></g>
    <text x="24" y="325" class="lab" fill="#865a2c">戰術武器</text>
    <g class="item"><circle cx="30" cy="351" r="4" fill="#a57645"/><text x="44" y="357">刻意練習</text>
      <circle cx="30" cy="381" r="4" fill="#a57645"/><text x="44" y="387">錯題本</text></g>
    <rect x="16" y="424" width="248" height="40" rx="20" fill="#a57645" fill-opacity=".14"/>
    <text x="140" y="450" class="chip" fill="#734b22">太沉悶 → 插 木 / 火 鬆土</text>
  </g>

  <!-- Lesson rhythm -->
  <g transform="translate(60,665)">
    <rect width="560" height="195" rx="18" fill="#fff" stroke="#e6dfd4" stroke-width="2"/>
    <text x="24" y="40" class="h" font-size="21">先嚴後寬<tspan class="soft" font-size="16" font-weight="400" dx="10">課堂節奏</tspan></text>
    <text x="24" y="66" class="faint" font-size="16">開課先鎮場立規矩，再放手激活</text>

    <rect x="24" y="88" width="230" height="84" rx="14" fill="#f3eee6"/>
    <circle cx="58" cy="130" r="22" fill="#a57645"/><text x="58" y="137" class="glyph" font-size="21">土</text>
    <circle cx="106" cy="130" r="22" fill="#c99a3b"/><text x="106" y="137" class="glyph" font-size="21">金</text>
    <text x="140" y="124" class="h" font-size="17">開課初期</text>
    <text x="140" y="150" class="soft" font-size="16">鎮場 · 立規矩</text>

    <path d="M264 130h28" stroke="#b7ad9f" stroke-width="2.5"/>
    <path d="M290 122l10 8-10 8z" fill="#b7ad9f"/>

    <rect x="306" y="88" width="230" height="84" rx="14" fill="#f3eee6"/>
    <circle cx="340" cy="130" r="22" fill="#e0603a"/><text x="340" y="137" class="glyph" font-size="21">火</text>
    <circle cx="388" cy="130" r="22" fill="#3f8cc0"/><text x="388" y="137" class="glyph" font-size="21">水</text>
    <text x="422" y="124" class="h" font-size="17">中後段</text>
    <text x="422" y="150" class="soft" font-size="16">激活 · 承接</text>
  </g>

  <!-- Response matrix -->
  <g transform="translate(640,665)">
    <rect width="900" height="195" rx="18" fill="#fff" stroke="#e6dfd4" stroke-width="2"/>
    <text x="24" y="40" class="h" font-size="21">動態應變矩陣<tspan class="soft" font-size="16" font-weight="400" dx="10">看見訊號，切換組合</tspan></text>

    <g transform="translate(24,60)">
      <rect width="204" height="115" rx="14" fill="#f3eee6"/>
      <text x="16" y="32" class="h" font-size="19">認知疲勞</text>
      <text x="16" y="58" class="soft" font-size="15.5">眼神呆滯、停留過長</text>
      <circle cx="34" cy="88" r="17" fill="#e0603a"/><text x="34" y="94" class="glyph" font-size="17">火</text>
      <text x="64" y="94" class="faint" font-size="18" text-anchor="middle">+</text>
      <circle cx="94" cy="88" r="17" fill="#4f9a5a"/><text x="94" y="94" class="glyph" font-size="17">木</text>
    </g>
    <g transform="translate(239,60)">
      <rect width="204" height="115" rx="14" fill="#f3eee6"/>
      <text x="16" y="32" class="h" font-size="19">挫折過載</text>
      <text x="16" y="58" class="soft" font-size="15.5">集體掉入陷阱</text>
      <circle cx="34" cy="88" r="17" fill="#3f8cc0"/><text x="34" y="94" class="glyph" font-size="17">水</text>
      <text x="64" y="94" class="faint" font-size="18" text-anchor="middle">+</text>
      <circle cx="94" cy="88" r="17" fill="#4f9a5a"/><text x="94" y="94" class="glyph" font-size="17">木</text>
    </g>
    <g transform="translate(454,60)">
      <rect width="204" height="115" rx="14" fill="#f3eee6"/>
      <text x="16" y="32" class="h" font-size="19">紀律渙散</text>
      <text x="16" y="58" class="soft" font-size="15.5">答題快但錯誤率高</text>
      <circle cx="34" cy="88" r="17" fill="#a57645"/><text x="34" y="94" class="glyph" font-size="17">土</text>
      <text x="64" y="94" class="faint" font-size="18" text-anchor="middle">+</text>
      <circle cx="94" cy="88" r="17" fill="#c99a3b"/><text x="94" y="94" class="glyph" font-size="17">金</text>
    </g>
    <g transform="translate(669,60)">
      <rect width="204" height="115" rx="14" fill="#f3eee6"/>
      <text x="16" y="32" class="h" font-size="19">基礎不牢</text>
      <text x="16" y="58" class="soft" font-size="15.5">答案對但步驟缺失</text>
      <circle cx="34" cy="88" r="17" fill="#c99a3b"/><text x="34" y="94" class="glyph" font-size="17">金</text>
      <text x="64" y="94" class="faint" font-size="18" text-anchor="middle">+</text>
      <circle cx="94" cy="88" r="17" fill="#a57645"/><text x="94" y="94" class="glyph" font-size="17">土</text>
    </g>
  </g>

  <text x="60" y="886" class="faint" font-size="15">五行不與 TLA 階段死板綁定，按學生即時狀態動態切換。</text>
  </g>
</svg>
