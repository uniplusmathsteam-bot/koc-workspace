<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Food Substance Functions | S3 Biology</title>
  <link rel="stylesheet" href="../osmosis/bio-typography.css" />
  <link rel="stylesheet" href="../osmosis/embed.css" />
  <script src="../osmosis/embed.js"></script>
  <script src="../osmosis/tool-back.js" data-position="top-right" data-hub="../osmosis/lab.html"></script>
  <style>
    :root {
      --bg: #ffffff;
      --ink: #1a1a1a;
      --muted: #5c5c5c;
      --line: #2b2b2b;
      --soft: #e8e8e8;
      --panel: #f7f7f7;
      --ok: #2b8a3e;
      --heat: #e85d04;
      --carb: #c47b14;
      --lipid: #2b8a3e;
      --prot: #3d5a99;
      --water: #3b82b0;
      --fibre: #6b7c3a;
      --vit: #b4536a;
      --min: #8a6a3a;
      --ion: #5a6e8a;
      --na: #6b4ea0;
      --body: #dcdcdc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: var(--bg);
      color: var(--ink);
      min-height: 100%;
    }

    body {
      font-family: var(--bio-font-sans);
      line-height: 1.45;
    }

    .page {
      min-height: 100vh;
      padding: 18px 22px 28px;
      max-width: 1100px;
      margin: 0 auto;
    }

    html.bio-embed .page { min-height: 0; padding: 10px 14px 18px; }

    .crumb {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 10px;
      min-height: 1.2em;
    }

    .crumb button {
      border: 0;
      background: none;
      color: var(--ink);
      font: inherit;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .crumb span.sep { color: #bbb; }

    .head h1 {
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .head p {
      color: var(--muted);
      font-size: 0.92rem;
      max-width: 46rem;
      margin-top: 4px;
    }

    .group { margin-top: 22px; }

    .group-kicker {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .group-note {
      font-size: 0.8rem;
      color: var(--muted);
      margin: -2px 0 10px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      appearance: none;
      border: 2px solid var(--line);
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-weight: 600;
      font-size: 0.92rem;
      padding: 8px 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: baseline;
      gap: 8px;
    }

    .tag:hover, .tag:focus-visible { background: #f3f3f3; outline: none; }

    .tag .zh {
      font-weight: 500;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .tag[data-accent="carb"] { border-left: 8px solid var(--carb); }
    .tag[data-accent="lipid"] { border-left: 8px solid var(--lipid); }
    .tag[data-accent="prot"] { border-left: 8px solid var(--prot); }
    .tag[data-accent="fibre"] { border-left: 8px solid var(--fibre); }
    .tag[data-accent="water"] { border-left: 8px solid var(--water); }
    .tag[data-accent="vit"] { border-left: 8px solid var(--vit); }
    .tag[data-accent="min"] { border-left: 8px solid var(--min); }
    .tag[data-accent="ion"] { border-left: 8px solid var(--ion); }
    .tag[data-accent="na"] { border-left: 8px solid var(--na); }

    .facts {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0 18px;
    }

    .fact {
      border: 1.5px solid var(--soft);
      padding: 6px 10px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .fact strong { color: var(--ink); font-weight: 650; }

    .fn-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 10px;
    }

    .fn-card {
      text-align: left;
      border: 2px solid var(--line);
      background: #fff;
      padding: 14px 14px 12px;
      cursor: pointer;
      min-height: 108px;
    }

    .fn-card:hover, .fn-card:focus-visible { background: #f7f7f7; outline: none; }

    .fn-card .n {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .fn-card h3 {
      font-size: 1.02rem;
      margin: 4px 0 6px;
      letter-spacing: -0.02em;
    }

    .fn-card p {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .demo-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(240px, 0.85fr);
      gap: 16px;
      align-items: stretch;
      min-height: 520px;
      margin-top: 14px;
    }

    .stage {
      border: 1.5px solid #e6e6e6;
      background: #fff;
      min-height: 480px;
      height: 100%;
      position: relative;
      overflow: hidden;
    }
    .demo-layout:has(.three-fun) {
      min-height: 0;
      align-items: start;
    }
    .stage:has(.three-fun) {
      min-height: 0;
      height: auto;
      overflow: hidden;
    }
    .stage-embed,
    .demo-layout:has(.stage-embed) {
      min-height: 560px;
    }
    .tool-frame {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 560px;
      border: 0;
      background: #fff;
    }

    .compare .person {
      transform: translateX(-50%) scale(0.82);
      transform-origin: top center;
    }

    .compare.support-align .side {
      display: flex;
      flex-direction: column;
    }
    .compare.support-align .figure-slot {
      position: relative;
      flex: 1;
      min-height: 420px;
    }
    .compare.support-align .person,
    .compare.support-align .plant-conn {
      position: absolute;
      left: 50%;
      top: auto;
      bottom: 20px;
      transform: translateX(-50%);
      transform-origin: bottom center;
    }
    .compare.support-align .person {
      transform: translateX(-50%) scale(0.78);
    }

    .panel {
      border: 1.5px solid #e6e6e6;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .panel h2 { font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
    .panel .lead { font-size: 0.9rem; }
    .panel .caption {
      font-size: 0.84rem;
      color: var(--muted);
      border-top: 1px solid var(--soft);
      padding-top: 10px;
    }

    .ctrl label {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      font-weight: 650;
      margin-bottom: 6px;
    }

    .ctrl input[type="range"] { width: 100%; }

    .step-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .step-row button, .ghost {
      border: 2px solid var(--line);
      background: #fff;
      font: inherit;
      font-weight: 650;
      padding: 6px 12px;
      cursor: pointer;
    }
    .step-row button[aria-current="true"], .step-row button.active {
      background: var(--ink);
      color: #fff;
    }

    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 480px;
    }

    /* 2D block person */
    .person {
      position: absolute;
      left: 50%;
      top: 36px;
      width: 220px;
      height: 400px;
      transform: translateX(-50%);
    }

    .blk {
      position: absolute;
      background: var(--body);
      border: 2px solid var(--line);
    }

    .person .head { left: 70px; top: 0; width: 80px; height: 80px; }
    .person .eye {
      position: absolute; top: 28px; width: 12px; height: 8px;
      background: #fff; border: 2px solid var(--line);
    }
    .person .eye.l { left: 14px; }
    .person .eye.r { right: 14px; }
    .person .neck { left: 94px; top: 80px; width: 32px; height: 18px; }
    .person .torso { left: 62px; top: 96px; width: 96px; height: 150px; }
    .person .arm { top: 104px; width: 32px; height: 140px; }
    .person .arm.l { left: 26px; }
    .person .arm.r { left: 162px; }
    .person .leg { top: 246px; width: 36px; height: 140px; }
    .person .leg.l { left: 70px; }
    .person .leg.r { left: 114px; }

    .fat-coat {
      position: absolute;
      background: #c8e6c4;
      border: 2px solid var(--lipid);
      pointer-events: none;
    }

    .heat {
      position: absolute;
      width: 12px; height: 12px;
      background: var(--heat);
      border: 1.5px solid #9a3b00;
    }

    .heat.escape {
      animation: rise 1.15s linear infinite;
    }

    @keyframes rise {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-90px); }
    }

    .stacks {
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      height: 320px;
      padding: 24px 24px 8px;
    }

    .stack { width: 92px; text-align: center; }
    .stack .col {
      display: flex;
      flex-direction: column-reverse;
      gap: 3px;
      min-height: 260px;
      justify-content: flex-start;
    }
    .unit {
      height: 14px;
      border: 1.5px solid var(--line);
    }
    .unit.glycogen { background: #f2c14e; }
    .unit.lipid { background: #7cb87a; }
    .unit.protein { background: #7f97c9; }
    .stack .lbl { font-size: 0.75rem; font-weight: 700; margin-top: 8px; }
    .stack .kg { font-size: 0.75rem; color: var(--muted); }

    .graph-img {
      display: block;
      width: calc(100% - 24px);
      margin: 8px 12px 12px;
      border: 1.5px solid #eee;
      background: #fff;
    }

    .photo-stage {
      height: 100%;
      min-height: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      background: #fff;
    }
    .photo-model {
      display: block;
      max-width: 100%;
      max-height: 420px;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    .gut {
      position: absolute;
      left: 50%;
      top: 70px;
      width: 70px;
      height: 340px;
      transform: translateX(-50%);
      border: 2px solid var(--line);
      background: #f3f3f3;
      overflow: hidden;
    }

    .bolus {
      position: absolute;
      left: 10px;
      width: 46px;
      height: 36px;
      background: #c5d39a;
      border: 2px solid var(--fibre);
    }

    .wave {
      position: absolute;
      left: 0; right: 0;
      height: 18px;
      background: rgba(107, 124, 58, 0.25);
      animation: peristal 1.6s linear infinite;
    }

    @keyframes peristal {
      0% { top: -20px; }
      100% { top: 340px; }
    }

    .compare {
      display: grid;
      grid-template-columns: 1fr 1fr;
      height: 100%;
      min-height: 480px;
    }

    .compare .side {
      position: relative;
      border-right: 1.5px solid #eee;
      padding-top: 10px;
    }
    .compare .side:last-child { border-right: 0; }
    .compare .side h4 {
      text-align: center;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .energy-bar {
      position: absolute;
      left: 50%;
      bottom: 48px;
      transform: translateX(-50%);
      width: 36px;
      background: var(--heat);
      border: 2px solid #9a3b00;
    }

    .plant {
      position: absolute;
      left: 50%;
      bottom: 24px;
      width: 180px;
      height: 360px;
      transform: translateX(-50%);
    }

    .plant .pot { left: 50px; bottom: 0; width: 80px; height: 36px; }
    .plant .stem { left: 82px; bottom: 36px; width: 16px; height: 180px; background: #9ccc65; }
    .plant .leaf {
      width: 54px; height: 28px; background: #7cb342;
    }
    .plant .leaf.a { left: 28px; bottom: 160px; }
    .plant .leaf.b { left: 98px; bottom: 200px; }
    .plant .vac { left: 70px; bottom: 70px; width: 40px; height: 90px; background: #bbdefb; }

    .sugar {
      position: absolute;
      width: 14px; height: 14px;
      background: #f2c14e;
      border: 1.5px solid var(--line);
    }

    .membrane {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 280px;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .phos-row > div {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .phos-row { display: flex; justify-content: center; gap: 4px; }
    .head-p {
      width: 22px; height: 18px;
      background: #4aa3df;
      border: 1.5px solid var(--line);
    }
    .tail-p {
      width: 8px; height: 46px;
      background: #f0c36a;
      border: 1.5px solid var(--line);
      margin: 0 auto;
    }

    .yab {
      position: absolute;
      width: 28px; height: 22px;
      background: var(--prot);
      border: 2px solid var(--line);
      clip-path: polygon(0 0, 40% 0, 50% 55%, 60% 0, 100% 0, 70% 100%, 30% 100%);
    }

    .antigen {
      position: absolute;
      width: 16px; height: 16px;
      background: #d12626;
      border: 2px solid var(--line);
    }

    .rbc {
      position: absolute;
      width: 36px; height: 24px;
      background: #e07070;
      border: 2px solid var(--line);
    }

    .o2 {
      position: absolute;
      width: 12px; height: 12px;
      background: #90caf9;
      border: 1.5px solid var(--line);
      font-size: 8px;
      text-align: center;
      line-height: 12px;
    }

    .nerve {
      position: absolute;
      left: 40px; right: 40px; top: 200px;
      height: 18px;
      background: #eee;
      border: 2px solid var(--line);
    }

    .myelin {
      position: absolute;
      top: -10px;
      height: 38px;
      background: #c8e6c4;
      border: 2px solid var(--lipid);
    }

    .impulse {
      position: absolute;
      top: -4px;
      width: 14px; height: 26px;
      background: var(--heat);
      border: 2px solid #9a3b00;
    }

    .drop {
      position: absolute;
      width: 16px; height: 20px;
      background: var(--water);
      border: 2px solid #1e5678;
      border-radius: 0 10px 10px 10px;
      transform: rotate(-40deg);
    }

    .scene-label {
      position: absolute;
      left: 12px; top: 10px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--muted);
    }

    .formula {
      font-family: var(--bio-font-mono);
      font-size: 0.82rem;
    }

    .hidden { display: none !important; }

    .fuel-demo {
      display: grid;
      grid-template-columns: 1fr 1fr;
      height: 100%;
      min-height: 480px;
    }
    .fuel-lane {
      position: relative;
      border-right: 1.5px solid #eee;
      overflow: hidden;
    }
    .fuel-lane:last-child { border-right: 0; }
    .fuel-lane h4 {
      text-align: center;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 10px 8px 0;
    }
    .fuel-lane .person {
      top: 86px;
      transform: translateX(-50%) scale(0.72);
      transform-origin: top center;
    }
    .fuel-lane .mouth-box {
      position: absolute;
      left: 50%;
      top: 128px;
      width: 42px;
      height: 20px;
      margin-left: -21px;
      background: #fff;
      border: 2px solid var(--line);
      z-index: 4;
    }
    .uv {
      position: absolute;
      width: 28px;
      height: 14px;
      background: #e8a317;
      border: 1.5px solid var(--line);
      font-size: 8px;
      font-weight: 800;
      text-align: center;
      line-height: 14px;
      color: #1a1a1a;
      z-index: 5;
    }
    .fuel-track { position: absolute; inset: 0; pointer-events: none; }
    .bit {
      position: absolute;
      width: 14px; height: 14px;
      background: #f2c14e;
      border: 1.5px solid var(--line);
    }
    .bit.chain { width: 18px; height: 18px; background: #c47b14; }
    .energy-meter {
      position: absolute;
      left: 12px; right: 12px; bottom: 16px;
      height: 22px;
      border: 2px solid var(--line);
      background: #fff;
    }
    .energy-meter i {
      display: block;
      height: 100%;
      width: 0;
      background: var(--heat);
    }
    .energy-meter span {
      position: absolute;
      right: 8px; top: 1px;
      font-size: 0.72rem;
      font-weight: 700;
    }
    .scissor {
      position: absolute;
      width: 10px; height: 22px;
      background: #555;
      border: 1.5px solid var(--line);
    }

    .store-layout, .sucrose-layout {
      display: grid;
      grid-template-columns: 92px 1fr;
      height: 100%;
      min-height: 480px;
    }
    .sucrose-layout { grid-template-columns: 1fr 1fr; }
    .pct-rail {
      position: relative;
      border-right: 1.5px solid #eee;
      margin: 16px 0 16px 12px;
      background: #f4f4f4;
      border: 2px solid var(--line);
    }
    .pct-fill {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      background: var(--heat);
    }
    .pct-fill.carb { background: #e8a317; }
    .pct-fill.lipid { background: #2b8a3e; }
    .pct-legend {
      position: absolute;
      left: 4px; right: 4px; top: 40px;
      font-size: 0.62rem;
      font-weight: 700;
      color: var(--muted);
      text-align: center;
      line-height: 1.35;
    }
    .pct-num {
      position: absolute;
      left: 0; right: 0; top: 8px;
      text-align: center;
      font-weight: 800;
      font-size: 1.05rem;
      z-index: 2;
    }
    .pct-cap {
      position: absolute;
      left: 4px; right: 4px; bottom: 10px;
      text-align: center;
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--muted);
    }
    .store-layout .compare { min-height: 0; }

    .phloem-cut {
      position: relative;
      margin: 28px 16px 16px 8px;
      border: 2px solid var(--line);
      background: #fafafa;
      overflow: hidden;
      min-height: 420px;
      height: auto;
    }
    .phloem-cut .cs-title {
      position: absolute;
      left: 8px; top: 8px;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
      z-index: 2;
    }
    .phloem-cut .layer {
      position: absolute;
      left: 0; right: 0;
    }
    .phloem-cut .xylem {
      left: 18%; width: 28%; top: 36px; bottom: 12px;
      background: #bbdefb;
      border: 2px solid #1e5678;
    }
    .phloem-cut .phloem {
      left: 52%; width: 30%; top: 36px; bottom: 12px;
      background: #fff3cd;
      border: 2px solid #c47b14;
      overflow: hidden;
    }
    .phloem-cut .lab {
      position: absolute;
      font-size: 0.68rem;
      font-weight: 700;
    }

    .tissue {
      position: absolute;
      inset: 36px 16px 16px;
    }
    .pcell {
      position: absolute;
      background: #e8f5e9;
      border: 8px solid #6b7c3a;
      overflow: hidden;
    }
    .pcell .proto {
      position: absolute;
      background: #bbdefb;
      border: 2px solid var(--line);
    }
    .fiber {
      position: absolute;
      background: #8a9a4a;
      border: 1px solid #4e5c28;
    }
    .tear {
      position: absolute;
      background: #fff;
      border: 1.5px solid #6b5344;
    }
    .stain {
      position: absolute;
      background: #2f3b18;
      opacity: 0.55;
    }

    .person.shivering {
      animation: shiver 0.7s ease-in-out infinite;
    }
    @keyframes shiver {
      0%, 100% { transform: translateX(-50%) translate(0, 0); }
      50% { transform: translateX(-50%) translate(-1.5px, 0); }
    }

    .fist {
      position: absolute;
      width: 46px; height: 36px;
      background: #8d6e63;
      border: 2px solid var(--line);
      z-index: 4;
    }
    .organ-box {
      position: absolute;
      background: #c9c4b0;
      border: 2px solid var(--line);
      z-index: 2;
    }
    .fat-pad {
      position: absolute;
      background: #c8e6c4;
      border: 2px solid var(--lipid);
      z-index: 1;
    }
    .dmg {
      position: absolute;
      background: #d12626;
      opacity: 0;
      z-index: 3;
    }

    .grey-skin {
      position: absolute;
      left: 48px; right: 48px;
      top: 210px; height: 88px;
      background: #cfcfcf;
      border: 2px solid var(--line);
      overflow: hidden;
    }
    .rain { position: absolute; inset: 0; pointer-events: none; }

    .bilayer {
      position: absolute;
      left: 50%; top: 50%;
      width: 340px; height: 160px;
      transform: translate(-50%, -50%);
    }
    .plipid { position: absolute; width: 22px; display: flex; flex-direction: column; align-items: center; }
    .plipid .head-p { margin: 0 auto; }
    .plipid .tail-p { margin: 0 auto; }
    .chol {
      position: absolute;
      width: 10px; height: 22px;
      background: #e65100;
      border: 1.5px solid var(--line);
    }

    .grow-wrap {
      position: absolute;
      left: 50%; top: 24px;
