<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Food Test Lab · DSE Food Bank</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../osmosis/embed.css" />
  <link rel="stylesheet" href="./food-lab.css" />
  <script src="../osmosis/embed.js"></script>
  <script src="../osmosis/tool-back.js" data-hub="../osmosis/lab.html"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">Ch 5 · Food</div>
      <div class="tabs" role="tablist">
        <button type="button" class="tab active" data-tab="lab" role="tab" aria-selected="true">Food test</button>
        <button type="button" class="tab" data-tab="bank" role="tab" aria-selected="false">Food bank</button>
      </div>
      <div class="top-actions">
        <button type="button" class="btn" id="btn-drop">Add 1 cm³ of selected food</button>
        <button type="button" class="btn" id="btn-clear">Clear bench</button>
      </div>
    </header>

    <section class="panel active" id="panel-lab" role="tabpanel">
      <div class="lab-stage">
        <aside class="col col-left">
          <div class="conc-panel" id="conc-panel">
            <div id="conc-slider-wrap">
              <label><span id="conc-label">DCPIP concentration</span><span class="conc-val" id="conc-val">0.1%</span></label>
              <input type="range" id="conc-slider" min="0.05" max="1" step="0.05" value="0.1" />
            </div>
            <div id="protein-scale" class="protein-scale" hidden></div>
            <p class="conc-hint" id="conc-hint"></p>
          </div>
          <div class="col-head">Food samples</div>
          <div class="food-scroll" id="food-list"></div>
        </aside>

        <div class="center">
          <div class="apparatus" id="apparatus" aria-label="Apparatus"></div>
          <div class="bench" id="bench">
            <p class="empty-hint">White bench — pick a test, drag apparatus here, then place test tubes anywhere on the bench. A tube goes into the water bath only if you drop it inside. One dropper of food or test solution = 1 cm³ (vitamin C sample stays dropwise).</p>
          </div>
          <div class="obs" id="obs"></div>
        </div>

        <aside class="col col-right">
          <label class="cat-field" for="test-cat">
            <span class="cat-label">Food test category:</span>
            <select id="test-cat" class="cat-select">
              <option value="">-- Please Select --</option>
              <option value="Carbohydrates">Carbohydrates</option>
              <option value="Proteins">Proteins</option>
              <option value="Lipids">Lipids</option>
              <option value="Vitamin C">Vitamin C</option>
              <option value="Energy">Energy</option>
            </select>
          </label>
          <div id="test-block">
            <div class="col-head">Tests</div>
            <div class="test-scroll" id="test-list"></div>
          </div>
        </aside>
      </div>
    </section>

    <section class="panel" id="panel-bank" role="tabpanel">
      <div class="bank">
        <div class="bank-bar">
          <input type="search" id="bank-q" placeholder="Search DSE foods…" />
          <button type="button" class="filter-chip on" data-filter="all">All</button>
          <button type="button" class="filter-chip" data-filter="vitC">Vitamin C</button>
          <button type="button" class="filter-chip" data-filter="rs">Reducing sugar</button>
          <button type="button" class="filter-chip" data-filter="nrs">Non-reducing</button>
          <button type="button" class="filter-chip" data-filter="starch">Starch</button>
          <button type="button" class="filter-chip" data-filter="protein">Protein</button>
          <button type="button" class="filter-chip" data-filter="lipid">Lipid</button>
        </div>
        <div class="bank-grid" id="bank-grid"></div>
      </div>
    </section>
  </div>
  <div class="ghost" id="ghost" hidden></div>
  <script src="./js/food-lab.js"></script>
</body>
</html>
