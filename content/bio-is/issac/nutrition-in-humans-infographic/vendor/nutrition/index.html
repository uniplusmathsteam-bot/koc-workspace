<!doctype html>
<html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nutrition classroom · 運輸、同化與排遺</title><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="mechanism-v3.css"><link rel="stylesheet" href="single-viewport.css"></head>
<body><header><div><small>HKDSE BIOLOGY · HUMAN NUTRITION</small><h1>Nutrition classroom <span>營養教室</span></h1></div><div class="header-tools"><button id="prevTopic" aria-label="Previous topic">◀</button><button id="nextTopic" aria-label="Next topic">▶</button><button id="fullscreen">⛶ Fullscreen 全螢幕</button></div></header>
<nav id="topics" aria-label="Knowledge points"></nav>
<section class="toolbar"><span>SHOW · 顯示</span><button data-panel="model" aria-pressed="true">Model 模型</button><button data-panel="text" aria-pressed="true">Text 解說</button><button data-panel="notes" aria-pressed="true">Notes 原筆記</button><button data-panel="practice" aria-pressed="false">Practice 練習</button><button id="fitAll" aria-pressed="false">Fit all 全部顯示</button><button id="library">All 66 pages 全部內容</button><span class="spacer"></span><label>Find in notes <input id="search" placeholder="Search English / 中文" type="search"></label></section>
<main id="workspace"><section class="panel" id="modelPanel"><div class="panel-label">EXPLORE · 互動教學 <span id="modelRef"></span></div><h2 id="modelTitle"></h2><div id="modelControls"></div><div id="processStory" hidden aria-live="polite"></div><div id="modelStage"></div><div class="playback-row"><div class="playbar"><button id="play">▶ Animate 動畫</button><button id="replay">↻ Replay 重播</button><label>Speed <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label></div><label class="timeline-label">Explore stage · 逐步觀察 <input id="timeline" type="range" min="0" max="1000" value="0" aria-label="Animation stage"></label></div><details class="mechanism-explanation"><summary id="captionSummary">Mechanism detail · 機制詳情</summary><p id="modelCaption" role="status"></p></details></section>
<section class="panel" id="textPanel"><div class="panel-label">EXPLAIN · 解說 <button id="fontDown" aria-label="Smaller text">A−</button><button id="fontUp" aria-label="Larger text">A+</button></div><div id="lessonText"></div></section>
<section class="panel notes-panel" id="notesPanel"><div class="panel-label">ORIGINAL NOTES · 原文與原排版 <button id="noteExpand" aria-pressed="false">⛶ Enlarge 放大</button><button id="reviewed" aria-pressed="false">✓ Reviewed 已讀</button></div><div class="note-controls"><select id="document" aria-label="Source document"><option value="a">7.5–7.6 · 29 pages</option><option value="b">7.6–7.7 · 37 pages</option></select><button id="prevPage" aria-label="Previous page">◀</button><select id="page" aria-label="PDF page"></select><button id="nextPage" aria-label="Next page">▶</button><select id="noteScale" aria-label="Notes zoom"><option value="page">Fit page 全頁</option><option value="width">Fit width 全寬</option><option value="detail">150%</option></select><a id="download" download>PDF ↗</a></div><div id="noteViewport"><div id="noteSheet"><img id="noteImage" alt=""><div id="textLayer"></div></div></div><div id="sourceCaption"></div></section>
<section class="panel" id="practicePanel" hidden><div class="panel-label">RECALL · 溫習與課後練習</div><div id="practice"></div></section></main>
<div id="searchResults" hidden role="dialog" aria-label="Search results"><div><strong id="searchSummary"></strong><button id="closeSearch">Close 關閉 ×</button></div><div id="results"></div></div>
<aside id="dock" aria-label="Writing tools"><button data-tool="move" aria-pressed="true" title="Explore">↖</button><button data-tool="pen" title="Pen 筆">✎</button><button data-tool="laser" title="Laser 雷射">◎</button><button data-tool="eraser" title="Eraser 擦膠">▱</button><input type="color" id="inkColor" value="#e11d48" aria-label="Ink colour"><button id="undo" title="Undo">↶</button><button id="clear" title="Clear ink">⌫</button></aside><canvas id="ink" aria-label="Annotation canvas"></canvas>
<footer id="footer">66 / 66 source pages · Original layout preserved · 教學模型為示意圖</footer>
