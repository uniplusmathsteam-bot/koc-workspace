<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>JM31 · Concept &amp; Formula</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    html, body { height: 100%; }
    body {
      margin: 0;
      color: #1e293b;
      font-family: "Hanken Grotesk", system-ui, sans-serif;
      background: linear-gradient(180deg, #f8fafc, #f1f5f9);
    }
    .jm-page {
      height: 100%;
      box-sizing: border-box;
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 16px 12px;
      display: flex;
      flex-direction: column;
    }
    .jm-eyebrow {
      margin: 0 0 4px;
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #64748b;
    }
    h1 { margin: 0 0 10px; font-size: clamp(22px, 3vw, 30px); letter-spacing: -.03em; }
    .subnav { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
    .chip {
      background: #fff;
      border: 1px solid rgba(30, 41, 59, 0.12);
      color: #64748b;
      font: inherit;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 14px;
    }
    .chip.active { color: #fff; background: #4FC3F7; border-color: #4FC3F7; }
    .deck-slideshow { flex: 1; min-height: 280px; }
    .deck-wrap {
      width: 100%;
      height: 100%;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(30, 41, 59, 0.12);
      background: #0f172a;
    }
    .deck-wrap iframe { width: 100%; height: 100%; border: 0; display: block; }
    .hint { margin: 10px 0 0; color: #64748b; font-size: 13px; line-height: 1.45; }
  </style>
</head>
<body>
  <main class="jm-page">
    <p class="jm-eyebrow">JM31 · Lesson 31</p>
    <h1>Concept &amp; Formula</h1>
    <div class="subnav" aria-label="Concept decks">
      <button class="chip active" type="button" data-deck="slides/intro/index.html?v=20261030-concept">Mean, median, mode</button>
      <button class="chip" type="button" data-deck="slides/further/index.html?v=20261030-concept">Weighted mean and changes</button>
    </div>
    <div class="deck-slideshow">
      <div class="deck-wrap">
        <iframe id="deck-frame" src="slides/intro/index.html?v=20261030-concept" title="Mean, median and mode"></iframe>
      </div>
    </div>
    <p class="hint">Click or the right arrow finishes the step you are watching. Press it again for the next step. Space pauses or resumes. Left arrow goes back.</p>
  </main>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var frame = document.getElementById("deck-frame");
      var btns = document.querySelectorAll("[data-deck]");
      btns.forEach(function (b) {
        b.addEventListener("click", function () {
          btns.forEach(function (x) { x.classList.toggle("active", x === b); });
          if (frame.getAttribute("src") !== b.dataset.deck) {
            frame.src = b.dataset.deck;
            frame.title = b.textContent.trim();
          }
        });
      });
    });
  </script>
</body>
</html>
