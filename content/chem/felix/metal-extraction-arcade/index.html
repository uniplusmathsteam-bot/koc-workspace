<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Metal Extraction Arcade</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="shell" id="app">
      <section class="screen" id="screen-hub">
        <header class="topbar">
          <div>
            <p class="eyebrow">CHEM · Arcade</p>
            <h1>Metal Extraction</h1>
            <p class="lead">Three live paths. Drag, place, answer MCQs — extract the metal.</p>
          </div>
          <div class="topbar-actions">
            <span class="xp-chip" id="total-xp-chip">XP 0</span>
          </div>
        </header>

        <div class="path-grid" id="path-grid"></div>
      </section>

      <section class="screen hidden" id="screen-game">
        <header class="run-hud">
          <button type="button" class="btn-ghost" id="btn-quit">← Paths</button>
          <div class="hud-stats">
            <div class="hud-stat"><span>Score</span><strong id="hud-score">0</strong></div>
            <div class="hud-stat"><span>Streak</span><strong id="hud-streak">0</strong></div>
            <div class="hud-stat"><span>Combo</span><strong id="hud-combo">×1</strong></div>
            <div class="hud-stat"><span id="hud-progress-label">Step</span><strong id="hud-progress">1/8</strong></div>
            <div class="hud-stat hidden" id="hud-time-wrap"><span>Time</span><strong id="hud-time">90</strong></div>
          </div>
        </header>
        <div class="game-stage" id="game-stage"></div>
      </section>

      <section class="screen hidden" id="screen-results">
        <div class="results-card">
          <p class="eyebrow" id="results-path">Path complete</p>
          <h2 id="results-title">Nice run!</h2>
          <div class="stars" id="results-stars"></div>
          <div class="results-grid">
            <div><span>Score</span><strong id="results-score">0</strong></div>
            <div><span>Accuracy</span><strong id="results-accuracy">0%</strong></div>
            <div><span>Best streak</span><strong id="results-streak">0</strong></div>
            <div><span>XP gained</span><strong id="results-xp">0</strong></div>
          </div>
          <p class="results-note" id="results-note"></p>
          <div class="actions">
            <button type="button" class="btn-primary" id="btn-again">Play again</button>
            <button type="button" class="btn-secondary" id="btn-hub">Back to paths</button>
          </div>
        </div>
      </section>
    </div>

    <script src="js/ore-hunt.js"></script>
    <script src="js/blast-furnace.js"></script>
    <script src="js/electrolysis.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
