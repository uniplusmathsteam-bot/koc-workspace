<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 640" role="img" aria-label="Blast furnace diagram">
  <defs>
    <linearGradient id="heat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="35%" stop-color="#ea580c"/>
      <stop offset="70%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <ellipse cx="260" cy="42" rx="48" ry="14" fill="#475569"/>
  <circle cx="236" cy="34" r="7" fill="#334155"/>
  <circle cx="252" cy="28" r="8" fill="#1e293b"/>
  <circle cx="270" cy="32" r="7" fill="#64748b"/>
  <circle cx="284" cy="38" r="6" fill="#334155"/>
  <text x="78" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">iron ore + coke + limestone</text>
  <line x1="210" y1="38" x2="230" y2="38" stroke="#0f172a" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <path d="M210,70 L310,70 L318,100 L330,180 L338,280 L330,380 L310,470 L300,520 L220,520 L210,470 L190,380 L182,280 L190,180 L202,100 Z"
        fill="url(#shell)" stroke="#334155" stroke-width="3"/>

  <path d="M222,95 L298,95 L308,175 L316,275 L308,375 L292,460 L228,460 L212,375 L204,275 L212,175 Z"
        fill="url(#heat)" stroke="#9a3412" stroke-width="1.5"/>

  <path d="M240,70 L280,70 L270,92 L250,92 Z" fill="#64748b" stroke="#334155"/>
  <ellipse cx="260" cy="98" rx="22" ry="8" fill="#475569" stroke="#334155"/>

  <path d="M210,110 L168,88 L168,78" fill="none" stroke="#64748b" stroke-width="10" stroke-linecap="round"/>
  <path d="M310,110 L352,88 L352,78" fill="none" stroke="#64748b" stroke-width="10" stroke-linecap="round"/>
  <text x="360" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">hot waste gas</text>
  <path d="M352,70 L352,58" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <path d="M168,70 L168,58" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

  <line x1="260" y1="120" x2="260" y2="400" stroke="#db2777" stroke-width="8" stroke-linecap="round"/>
  <polygon points="248,400 260,430 272,400" fill="#db2777"/>
  <text x="272" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">250 C</text>
  <text x="272" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">700 C</text>
  <text x="340" y="268" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">furnace gets hotter</text>
  <text x="272" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">800 C - 1000 C</text>
  <text x="272" y="400" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">1500 C</text>

  <rect x="120" y="448" width="92" height="16" rx="4" fill="#94a3b8" stroke="#334155"/>
  <rect x="308" y="448" width="92" height="16" rx="4" fill="#94a3b8" stroke="#334155"/>
  <text x="70" y="440" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#dc2626">hot air</text>
  <text x="410" y="440" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#dc2626">hot air</text>
  <path d="M150,448 L190,448" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <path d="M370,448 L330,448" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrowRed)"/>

  <rect x="222" y="500" width="76" height="28" fill="#d6b48a" stroke="#92400e"/>
  <rect x="222" y="528" width="76" height="36" fill="#9a3412" stroke="#7c2d12"/>
  <text x="232" y="518" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#431407">molten slag</text>
  <text x="230" y="550" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff7ed">molten iron</text>

  <path d="M298,512 L360,512 L360,500" fill="none" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
  <path d="M222,548 L160,548 L160,560" fill="none" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
  <text x="368" y="508" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">molten slag runs off</text>
  <path d="M360,498 L360,486" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="38" y="580" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">molten iron runs off</text>
  <path d="M160,562 L160,574" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
</svg>
