<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Topic 01 Part 2 LQ Set 2</title>
  <style>
    :root {
      --blue: #00468c;
      --ink: #1a1a1a;
      --muted: #506478;
      --line: #c5d0dc;
      --fill: #eef4fa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Calibri, "Segoe UI", sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, #f7fafc 0%, #eef4fa 100%);
      min-height: 100vh;
      padding: 28px 20px 40px;
    }
    main {
      max-width: 640px;
      margin: 0 auto;
    }
    h1 {
      margin: 0 0 6px;
      color: var(--blue);
      font-size: 1.75rem;
    }
    .sub {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 0.95rem;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 12px;
    }
    a {
      display: block;
      padding: 14px 16px;
      background: #fff;
      border: 1px solid var(--line);
      border-bottom-width: 3px;
      border-radius: 8px;
      text-decoration: none;
      color: var(--ink);
      box-shadow: 0 1px 0 rgba(0, 70, 140, 0.04);
    }
    a:hover {
      background: var(--fill);
      border-color: var(--blue);
    }
    .label {
      font-weight: 700;
      color: var(--blue);
    }
    .meta {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Topic 01 Part 2 · LQ Set 2</h1>
    <p class="sub">Long-question Word worksheet. Download the file to open in Microsoft Word.</p>
    <ul>
      <li>
        <a href="Topic-01-Part-2-set-2.docx" download>
          <span class="label">Topic 01 Part 2 set 2</span>
          <span class="meta">Word document (.docx) · Long questions with answer key</span>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
