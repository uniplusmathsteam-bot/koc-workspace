<body class="bg-background font-body-md text-on-surface min-h-screen overflow-x-hidden">
  <canvas id="particle-canvas" class="fixed inset-0 opacity-[0.35] pointer-events-none z-0" aria-hidden="true"></canvas>

  <main class="max-w-container-max mx-auto px-4 sm:px-6 py-6 md:py-10 pb-16 relative z-10">
    <header class="mb-8 space-y-4">
      <div id="tag-row" class="flex flex-wrap gap-2"></div>
      <h1 id="chapter-title" class="text-primary font-headline-xl text-headline-xl"></h1>
      <p id="chapter-subtitle" class="text-on-surface-variant max-w-2xl font-body-md"></p>

      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 pt-2">
        <div id="filter-row" class="flex flex-wrap gap-2"></div>
        <div class="flex flex-wrap items-center gap-3 sm:gap-4">
          <div class="flex items-center gap-2">
            <span class="text-on-surface-variant font-body-sm">Study mode</span>
            <div id="mode-toggle" class="fc-mode-toggle">
              <button type="button" data-mode="sequence" class="active">Sequence</button>
              <button type="button" data-mode="random">Random</button>
            </div>
          </div>
          <span id="round-badge" class="px-3 py-1.5 rounded-2xl bg-primary/10 text-primary font-label-bold text-body-sm">Round 1</span>
          <div class="flex items-baseline gap-2">
            <span class="text-on-surface-variant font-body-sm">Progress</span>
            <span id="progress-text" class="text-primary font-headline-lg text-2xl font-bold">1 / 1</span>
          </div>
        </div>
      </div>
    </header>

    <div id="study-panel">
      <div class="relative min-h-[420px] h-[min(520px,70vh)] flex items-center justify-center perspective-1000 mb-6">
        <div class="card-layer absolute inset-x-8 top-8 bottom-4 scale-90 opacity-30 translate-y-4"></div>
        <div class="card-layer absolute inset-x-6 top-6 bottom-3 scale-95 opacity-45 translate-y-2"></div>

        <div id="card-container" class="relative w-full max-w-2xl h-[min(400px,65vh)] cursor-pointer">
          <div id="card-inner" class="card-inner relative w-full h-full">
            <div class="card-face absolute inset-0 rounded-2xl bg-surface-container-lowest border border-outline-variant/30 p-8 sm:p-10 flex flex-col shadow-lg">
              <div class="flex justify-between items-start gap-2">
                <span id="subtopic-pill" class="px-3 py-1 rounded-full border border-primary/20 text-primary font-label-bold text-body-sm"></span>
                <span id="card-code" class="px-2 py-1 rounded-md bg-surface-container-high font-label-code text-on-surface-variant"></span>
              </div>
              <div class="mt-6 flex-1 flex flex-col items-center justify-center min-h-0 w-full">
                <img id="card-front-img" class="card-front-image mx-auto hidden" alt="" />
                <div id="card-front-text" class="text-center w-full px-1"></div>
              </div>
              <p class="text-center text-on-surface-variant font-body-sm mt-4">Tap, space, or FLIP to reveal answer</p>
            </div>

            <div class="card-face card-face-back absolute inset-0 rounded-2xl bg-white border border-primary/20 p-8 sm:p-10 flex flex-col shadow-lg overflow-y-auto">
              <div class="flex justify-between items-start gap-2">
                <span class="subtopic-pill-back px-3 py-1 rounded-full border border-primary/20 text-primary font-label-bold text-body-sm"></span>
                <span class="card-code-back px-2 py-1 rounded-md bg-surface-container-high font-label-code text-on-surface-variant"></span>
              </div>
              <div class="mt-6 flex-1 flex flex-col items-center justify-center min-h-0 w-full">
                <div id="card-back-text" class="card-back-text text-center w-full px-1"></div>
                <img id="card-back-img" class="card-back-image mx-auto hidden" alt="" />
              </div>
            </div>
          </div>
        </div>
      </div>

      <p id="rating-hint" class="text-center font-body-sm text-on-surface-variant mb-4"></p>

      <div class="flex flex-wrap items-center justify-center gap-3 sm:gap-4">
        <button id="btn-prev" type="button" class="inline-flex items-center gap-1 px-4 py-2.5 rounded-xl border border-outline-variant/60 font-label-bold text-on-surface-variant disabled:opacity-45">
          <span class="material-symbols-outlined text-xl">chevron_left</span> Prev
        </button>
        <button id="btn-again" type="button" class="w-14 h-14 rounded-full bg-error-container text-tertiary flex items-center justify-center disabled:opacity-45" title="Again">
          <span class="material-symbols-outlined text-2xl">history</span>
        </button>
        <button id="btn-flip" type="button" class="w-20 h-20 rounded-full bg-primary text-white flex items-center justify-center shadow-md" title="Flip">
          <span class="material-symbols-outlined text-[40px]">sync</span>
        </button>
        <button id="btn-got-it" type="button" class="w-14 h-14 rounded-full bg-secondary-container text-secondary flex items-center justify-center disabled:opacity-45" title="Got it">
          <span class="material-symbols-outlined text-2xl">check</span>
        </button>
        <button id="btn-next" type="button" class="inline-flex items-center gap-1 px-4 py-2.5 rounded-xl border border-outline-variant/60 font-label-bold text-on-surface-variant disabled:opacity-45">
          Next <span class="material-symbols-outlined text-xl">chevron_right</span>
        </button>
      </div>
    </div>

    <div id="summary-panel" class="hidden max-w-[42rem] mx-auto space-y-6">
      <div class="text-center space-y-2">
        <span class="inline-block px-3 py-1 rounded-full bg-primary/10 text-primary font-label-bold">Round summary</span>
        <h2 id="summary-title" class="text-primary font-headline-lg text-2xl font-bold"></h2>
        <p id="summary-stats" class="text-on-surface-variant font-body-md"></p>
      </div>
      <div class="grid sm:grid-cols-2 gap-4">
        <div class="rounded-2xl border border-tertiary/30 bg-tertiary/5 p-4">
          <h3 class="text-tertiary font-label-bold mb-2">Keep practising</h3>
          <ul id="summary-keep" class="space-y-1 list-disc list-inside"></ul>
        </div>
        <div class="rounded-2xl border border-secondary/30 bg-secondary/5 p-4">
          <h3 class="text-secondary font-label-bold mb-2">Getting confident</h3>
          <ul id="summary-confident" class="space-y-1 list-disc list-inside"></ul>
        </div>
      </div>
      <p class="text-center text-on-surface-variant font-body-sm bg-surface-container-high/80 rounded-xl px-4 py-3">
        Tip: cards marked Again appear more often next round. Three Got its in a session lowers a card’s weight.
      </p>
      <div class="flex flex-col sm:flex-row gap-3 justify-center">
        <button id="btn-next-round" type="button" class="px-6 py-3 rounded-xl bg-primary text-white font-label-bold">Next round →</button>
        <button id="btn-restart" type="button" class="px-6 py-3 rounded-xl border border-outline-variant/60 font-label-bold text-on-surface-variant">Restart deck</button>
      </div>
    </div>
  </main>

/** Study algorithm — notes-to-flashcards / study-runtime.md */

var RATE_AGAIN = 1.7;
var RATE_GOT_IT = 0.7;
var RATE_NEUTRAL = 1.0;
var RATE_MASTERED = 0.1;
var GOT_IT_MASTER_COUNT = 3;

function rateToCopyCount(rate) {
  const whole = Math.floor(rate);
  const frac = rate - whole;
  return whole + (Math.random() < frac ? 1 : 0);
}

function createCardStates(deck) {
  const states = {};
  for (const card of deck) {
    states[card.id] = {
      nextRate: RATE_NEUTRAL,
      totalGotIt: 0,
      roundAgain: 0,
      roundGotIt: 0,
      roundNeutral: 0,
    };
  }
  return states;
}

function buildRoundCopyPlan(deck, cardStates, roundNumber) {
  if (roundNumber === 1) {
    return deck.map((c) => ({ id: c.id, count: 1 }));
  }
  const plan = [];
  for (const card of deck) {
    const count = rateToCopyCount(cardStates[card.id].nextRate);
    if (count > 0) plan.push({ id: card.id, count });
  }
  return plan;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i -= 1) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildSequenceQueueNoAdjacent(plan) {
  const remaining = new Map(plan.map((p) => [p.id, p.count]));
  const ids = [...remaining.keys()].sort((a, b) => a - b);
  const queue = [];
  let last = null;

  while ([...remaining.values()].some((n) => n > 0)) {
    let placed = false;
    for (const id of ids) {
      if ((remaining.get(id) || 0) <= 0) continue;
      if (id === last) continue;
      queue.push(id);
      remaining.set(id, remaining.get(id) - 1);
      last = id;
      placed = true;
      break;
    }
    if (!placed) {
      const id = ids.find((i) => (remaining.get(i) || 0) > 0);
      queue.push(id);
      remaining.set(id, remaining.get(id) - 1);
      last = id;
    }
  }
  return queue;
}

function buildRoundQueue(plan, roundNumber, mode) {
  if (!plan.length) return [];

  if (mode === "random") {
    if (roundNumber === 1) {
      return shuffle(plan.map((p) => p.id));
    }
    const expanded = [];
    for (const p of plan) {
      for (let i = 0; i < p.count; i += 1) expanded.push(p.id);
    }
    return shuffle(expanded);
  }

  if (roundNumber === 1) {
    return plan.map((p) => p.id).sort((a, b) => a - b);
  }
  return buildSequenceQueueNoAdjacent(plan);
}

class FlashcardSession {
  constructor(deck) {
    this.fullDeck = deck;
    this.activeDeck = deck;
    this.filterSubtopic = null;
    this.cardStates = createCardStates(deck);
    this.roundNumber = 1;
    this.mode = "sequence";
    this.roundCopyPlan = [];
    this.roundQueue = [];
    this.queueIndex = 0;
    this.flipped = false;
    this.phase = "study";
    this.sessionComplete = false;
    this.startRound();
  }

  setFilter(subtopic) {
    this.filterSubtopic = subtopic || null;
    this.activeDeck = subtopic
      ? this.fullDeck.filter((c) => c.subtopic === subtopic)
      : [...this.fullDeck];
    this.resetSession();
  }

  resetSession() {
    this.cardStates = createCardStates(this.activeDeck);
    this.roundNumber = 1;
    this.phase = "study";
    this.sessionComplete = false;
    this.startRound();
  }

  startRound() {
    for (const card of this.activeDeck) {
      const s = this.cardStates[card.id];
      s.roundAgain = 0;
      s.roundGotIt = 0;
      s.roundNeutral = 0;
    }

    this.roundCopyPlan = buildRoundCopyPlan(
      this.activeDeck,
      this.cardStates,
      this.roundNumber,
    );

    if (!this.roundCopyPlan.length) {
      this.phase = "summary";
      this.sessionComplete = true;
      this.roundQueue = [];
      this.queueIndex = 0;
      this.flipped = false;
      return;
    }

    this.roundQueue = buildRoundQueue(
      this.roundCopyPlan,
      this.roundNumber,
      this.mode,
    );
    this.queueIndex = 0;
    this.flipped = false;
    this.phase = "study";
    this.sessionComplete = false;
  }

  getCurrentCard() {
    const id = this.roundQueue[this.queueIndex];
    return this.activeDeck.find((c) => c.id === id) ?? null;
  }

  setMode(mode) {
    if (this.mode === mode || this.phase !== "study") return;
    this.mode = mode;
    this.roundQueue = buildRoundQueue(
      this.roundCopyPlan,
      this.roundNumber,
      this.mode,
    );
    this.queueIndex = 0;
    this.flipped = false;
  }

  flip() {
    if (this.phase !== "study") return;
    this.flipped = !this.flipped;
  }

  prev() {
    if (this.phase !== "study" || this.queueIndex <= 0) return;
    this.queueIndex -= 1;
    this.flipped = false;
  }

  nextNavigate() {
    if (this.phase !== "study") return;
    if (this.queueIndex < this.roundQueue.length - 1) {
      this.queueIndex += 1;
      this.flipped = false;
    }
  }

  advanceAfterRating() {
    this.flipped = false;
    if (this.queueIndex >= this.roundQueue.length - 1) {
      this.phase = "summary";
    } else {
      this.queueIndex += 1;
    }
  }

  rateAgain() {
    if (!this.flipped || this.phase !== "study") return false;
    const card = this.getCurrentCard();
    if (!card) return false;
    const s = this.cardStates[card.id];
    s.nextRate = RATE_AGAIN;
    s.totalGotIt = 0;
    s.roundAgain += 1;
    this.advanceAfterRating();
    return true;
  }

  rateGotIt() {
    if (!this.flipped || this.phase !== "study") return false;
    const card = this.getCurrentCard();
    if (!card) return false;
    const s = this.cardStates[card.id];
    s.totalGotIt += 1;
    s.roundGotIt += 1;
    s.nextRate =
      s.totalGotIt >= GOT_IT_MASTER_COUNT ? RATE_MASTERED : RATE_GOT_IT;
    this.advanceAfterRating();
    return true;
  }

  rateNext() {
    if (this.phase !== "study") return;
    const card = this.getCurrentCard();
    if (card && this.flipped) {
      this.cardStates[card.id].nextRate = RATE_NEUTRAL;
      this.cardStates[card.id].roundNeutral += 1;
      this.advanceAfterRating();
      return;
    }
    this.nextNavigate();
  }

  nextRound() {
    this.roundNumber += 1;
    this.startRound();
  }

  getSubtopics() {
    return [...new Set(this.fullDeck.map((c) => c.subtopic))];
  }

  getSummaryLists() {
    const keep = [];
    const confident = [];
    for (const card of this.activeDeck) {
      const s = this.cardStates[card.id];
      if (s.roundAgain > 0) keep.push(card);
      else if (s.roundGotIt > 0) confident.push(card);
    }
    return { keep, confident };
  }

  getRoundCardCount() {
    return this.roundCopyPlan.reduce((sum, p) => sum + p.count, 0);
  }
}

function escapeHtml(str) {
  return str
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function renderTags() {
  els.tagRow.innerHTML = FC_TAGS.map(
    (tag) =>
      `<span class="px-3 py-1 rounded-full bg-primary/10 text-primary font-label-bold text-body-sm">#${escapeHtml(tag)}</span>`,
  ).join("");
}

function renderFilters() {
  const subtopics = session.getSubtopics();
  const chips = [
    `<button type="button" class="filter-chip active px-3 py-1.5 rounded-full border border-outline-variant/60 text-on-surface-variant font-label-bold" data-filter="">全部</button>`,
    ...subtopics.map(
      (st) =>
        `<button type="button" class="filter-chip px-3 py-1.5 rounded-full border border-outline-variant/60 text-on-surface-variant font-label-bold" data-filter="${escapeHtml(st)}">${escapeHtml(st)}</button>`,
    ),
  ];
  els.filterRow.innerHTML = chips.join("");
  els.filterRow.querySelectorAll(".filter-chip").forEach((btn) => {
    btn.addEventListener("click", () => {
      els.filterRow
        .querySelectorAll(".filter-chip")
        .forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      session.setFilter(btn.dataset.filter || null);
      render();
    });
  });
}

function renderModeToggle() {
  els.modeToggle.querySelectorAll("button").forEach((btn) => {
    btn.classList.toggle("active", btn.dataset.mode === session.mode);
  });
}

function renderCard() {
  const card = session.getCurrentCard();
  if (!card) {
    els.cardFront.textContent = session.sessionComplete
      ? "本輪所有卡片已掌握！"
      : "沒有可顯示的卡片";
    els.cardBack.innerHTML = "";
    els.cardImage.classList.add("hidden");
    if (els.cardFrontImage) {
      els.cardFrontImage.classList.add("hidden");
      els.cardFrontImage.removeAttribute("src");
    }
    return;
  }

  els.subtopicPill.textContent = card.subtopic;
  els.cardCode.textContent = `Card ${card.id}`;
  document.querySelector(".subtopic-pill-back").textContent = card.subtopic;
  document.querySelector(".card-code-back").textContent = `Card ${card.id}`;
  // Wrap in one child so flex/grid on #card-front-text does not collapse
  // spaces around <strong> (e.g. "Define explosive substance").
  els.cardFront.innerHTML = `<span class="fc-card-copy">${card.front}</span>`;
  els.cardBack.innerHTML = `<span class="fc-card-copy">${card.back}</span>`;

  if (els.cardFrontImage) {
    if (card.frontImage) {
      els.cardFrontImage.src = card.frontImage.replace(/^\.\//, "");
      els.cardFrontImage.alt = card.frontImageAlt || "";
      els.cardFrontImage.classList.remove("hidden");
    } else {
      els.cardFrontImage.classList.add("hidden");
      els.cardFrontImage.removeAttribute("src");
    }
  }

  if (card.image) {
    els.cardImage.src = card.image.replace(/^\.\//, "");
    els.cardImage.alt = card.imageAlt || "";
    els.cardImage.classList.remove("hidden");
  } else {
    els.cardImage.classList.add("hidden");
    els.cardImage.removeAttribute("src");
  }

  els.cardInner.classList.toggle("card-flipped", session.flipped);
  els.ratingHint.textContent = session.flipped
    ? "← Again · Got it → 或按 1 / 2"
    : "點擊卡片、空白鍵或 FLIP 顯示答案";
  els.ratingHint.classList.toggle("text-tertiary", !session.flipped);

  const atStart = session.queueIndex <= 0;
  const atEnd = session.queueIndex >= session.roundQueue.length - 1;
  els.btnPrev.disabled = atStart;
  els.btnNext.disabled = session.phase !== "study" || (atEnd && !session.flipped);
  els.btnAgain.disabled = !session.flipped;
  els.btnGotIt.disabled = !session.flipped;
}

function renderStudyChrome() {
  const total = session.roundQueue.length || 0;
  const pos = total ? session.queueIndex + 1 : 0;
  els.progressText.textContent = `${pos} / ${total}`;
  els.roundBadge.textContent = `Round ${session.roundNumber} · ${session.getRoundCardCount()} cards`;
  renderModeToggle();
  renderCard();
}

function renderSummary() {
  const { keep, confident } = session.getSummaryLists();
  if (session.sessionComplete) {
    els.summaryTitle.textContent = "Deck complete";
    els.summaryStats.textContent =
      "所有卡片已達掌握權重 — 可重新開始或切換篩選。";
  } else {
    els.summaryTitle.textContent = `Round ${session.roundNumber} complete`;
    els.summaryStats.textContent = `${session.getRoundCardCount()} cards this round`;
  }

  const li = (c) =>
    `<li class="text-body-sm"><span class="font-label-code text-on-surface-variant">#${c.id}</span> ${escapeHtml(c.subtopic)} — ${stripHtml(c.front).slice(0, 48)}…</li>`;

  els.summaryKeep.innerHTML = keep.length
    ? keep.map(li).join("")
    : "<li class=\"text-on-surface-variant text-body-sm\">—</li>";
  els.summaryConfident.innerHTML = confident.length
    ? confident.map(li).join("")
    : "<li class=\"text-on-surface-variant text-body-sm\">—</li>";

  els.btnNextRound.textContent = session.sessionComplete
    ? "Restart deck"
    : "Next round →";
}

function stripHtml(html) {
  const d = document.createElement("div");
  d.innerHTML = html;
  return d.textContent || "";
}

function render() {
  const studying = session.phase === "study" && !session.sessionComplete;
  els.studyPanel.classList.toggle("hidden", !studying);
  els.summaryPanel.classList.toggle("hidden", studying);

  if (studying) {
    renderStudyChrome();
  } else {
    renderSummary();
  }
}

function initModeToggle() {
  els.modeToggle.querySelectorAll("button").forEach((btn) => {
    btn.addEventListener("click", () => {
      session.setMode(btn.dataset.mode);
      render();
    });
  });
}

function initControls() {
  els.btnFlip.addEventListener("click", () => {
    session.flip();
    renderCard();
  });
  els.cardContainer.addEventListener("click", (e) => {
    if (e.target.closest("button")) return;
    session.flip();
    renderCard();
  });
  els.btnPrev.addEventListener("click", () => {
    session.prev();
    renderCard();
  });
  els.btnNext.addEventListener("click", () => {
    session.rateNext();
    render();
  });
  els.btnAgain.addEventListener("click", () => {
    if (session.rateAgain()) render();
  });
  els.btnGotIt.addEventListener("click", () => {
    if (session.rateGotIt()) render();
  });
  els.btnNextRound.addEventListener("click", () => {
    if (session.sessionComplete) session.resetSession();
    else session.nextRound();
    render();
  });
  els.btnRestart.addEventListener("click", () => {
    session.resetSession();
    render();
  });
}

function initKeyboard() {
  document.addEventListener("keydown", (e) => {
    if (e.target.matches("input, textarea, select")) return;
    if (session.phase !== "study") return;

    if (e.code === "Space") {
      e.preventDefault();
      session.flip();
      renderCard();
      return;
    }

    if (!session.flipped) {
      if (e.key === "ArrowLeft") {
        session.prev();
        renderCard();
      } else if (e.key === "ArrowRight") {
        session.nextNavigate();
        renderCard();
      }
      return;
    }

    if (e.key === "ArrowLeft" || e.key === "1") {
      if (session.rateAgain()) render();
    } else if (e.key === "ArrowRight" || e.key === "2") {
      if (session.rateGotIt()) render();
    }
  });
}

function initTabReset() {
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") {
      window.parent.postMessage({ type: "s3bio-flashcards-reset" }, "*");
      session.resetSession();
      render();
    }
  });
  window.addEventListener("message", (e) => {
    if (e.data?.type === "s3bio-flashcards-reset") {
      session.resetSession();
      render();
    }
  });
}

function initParticles() {
  const canvas = document.getElementById("particle-canvas");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  if (!ctx) return;
  let w = 0;
  let h = 0;
  const dots = Array.from({ length: 40 }, () => ({
    x: Math.random(),
    y: Math.random(),
    r: 1 + Math.random() * 2,
    vx: (Math.random() - 0.5) * 0.0004,
    vy: (Math.random() - 0.5) * 0.0004,
  }));

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }

  function frame() {
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = "rgba(0, 78, 159, 0.12)";
    for (const d of dots) {
      d.x += d.vx;
      d.y += d.vy;
      if (d.x < 0 || d.x > 1) d.vx *= -1;
      if (d.y < 0 || d.y > 1) d.vy *= -1;
      ctx.beginPath();
      ctx.arc(d.x * w, d.y * h, d.r, 0, Math.PI * 2);
      ctx.fill();
    }
    requestAnimationFrame(frame);
  }

  resize();
  window.addEventListener("resize", resize);
  frame();
}
