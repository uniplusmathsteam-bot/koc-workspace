<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Name That Piece — HKDSE Topic 1</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="lab-bg" aria-hidden="true"></div>
  <header class="top">
    <div class="top-inner">
      <div>
        <p class="kicker">HKDSE Chemistry · Topic 01 · S3 lab</p>
        <h1>Name That Piece</h1>
        <p>Study the tray, then drill names, pictures, and uses. Press 1–4, Enter for next, Esc for home.</p>
      </div>
      <div class="top-side">
        <div class="top-actions">
          <button type="button" id="desc-toggle" class="desc-toggle" aria-pressed="false">Hide description</button>
          <div class="language-switch" role="group" aria-label="Language">
            <button type="button" data-lang="zh">中文</button>
            <button type="button" data-lang="en" class="active">English</button>
          </div>
          <button type="button" id="theme-toggle" class="theme-toggle" aria-pressed="false">Dark mode</button>
        </div>
        <div id="streak-hud"></div>
        <nav class="nav" id="nav"></nav>
      </div>
    </div>
  </header>

  <main>
    <section class="view" id="home"></section>
    <section class="view" id="learn"></section>
    <section class="view" id="drill"></section>
  </main>

  <canvas id="confetti" aria-hidden="true"></canvas>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
