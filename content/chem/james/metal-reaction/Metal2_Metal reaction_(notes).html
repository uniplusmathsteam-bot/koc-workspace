<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Metal2_Metal reaction_(notes)</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #111827;
    background: #eef3f8;
    padding-left: env(safe-area-inset-left);
    padding-right: calc(64px + env(safe-area-inset-right));
    padding-bottom: env(safe-area-inset-bottom);
  }
  button { font-family: inherit; cursor: pointer; }
  .topbar {
    position: relative;
    z-index: 55;
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: calc(52px + env(safe-area-inset-top));
    padding: env(safe-area-inset-top) 12px 0;
  }
  .topbar h1 {
    flex: 1;
    min-width: 0;
    margin: 0;
    font-size: 18px;
    font-weight: 650;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .nav {
    min-width: 64px;
    min-height: 44px;
    padding: 0 12px;
    border: 1px solid #d7e0ec;
    border-radius: 10px;
    background: #fff;
    font-size: 16px;
    color: #111827;
  }
  .nav:disabled { opacity: 0.35; cursor: default; }
  #metalList {
    position: relative;
    z-index: 56;
    flex: none;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 8px 12px 0;
  }
  .metal {
    flex: none;
    min-width: 44px;
    min-height: 44px;
    padding: 0 12px;
    border: 1px solid #d7e0ec;
    border-radius: 10px;
    background: #fff;
    font-size: 22px;
    font-weight: 650;
    color: #111827;
  }
  .metal[aria-pressed="true"] {
    background: #163a86;
    color: #fff;
    border-color: #163a86;
  }
  #hideBtn[aria-pressed="true"] { background: #163a86; color: #fff; }
  main {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: 8px 12px 8px;
    overflow: hidden;
  }
  #stage {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: #fff;
    border: 1px solid #d7e0ec;
    border-radius: 16px;
    overflow: hidden;
  }
  body.zoomed #stage { position: fixed; z-index: 30; margin: 0; }
  .stage-head {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    min-height: 52px;
    padding: 4px 8px 0 14px;
  }
  #stageName {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    font-size: 38px;
    font-weight: 650;
    line-height: 1.15;
    white-space: nowrap;
    transform-origin: left center;
    color: #111827;
  }
  #watchBtn {
    flex: none;
    margin-top: 2px;
    white-space: nowrap;
  }
  #zoomBtn {
    flex: none;
    width: 44px;
    height: 44px;
    margin-top: 2px;
    border: 1px solid #d7e0ec;
    border-radius: 10px;
    background: #fff;
    color: #163a86;
    font-size: 28px;
    line-height: 1;
  }
  #zoomBtn[aria-pressed="true"] { background: #163a86; color: #fff; }
  #zoomFit {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  #view {
    position: relative;
    flex: 1;
    min-height: 160px;
    touch-action: none;
    user-select: none;
    overflow: hidden;
  }
  #fig { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #fig text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 32px; fill: #111827; }
  .leader { fill: none; stroke: #64748b; stroke-width: 1.6; }
  .heat-word { fill: #e11d8b; font-weight: 700; }
  #eqBand {
    flex: none;
    height: calc(24px * 1.25 * 2);
    padding: 0 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  #eqBand.split {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    grid-auto-flow: column;
    column-gap: 18px;
    align-items: center;
  }
  #eqBand[hidden] { display: none; }
  .eq {
    margin: 0;
    height: calc(24px * 1.25);
    overflow: hidden;
    font-size: 24px;
    font-weight: 650;
    line-height: 1.25;
    white-space: nowrap;
  }
  .eq-inner { display: inline-block; transform-origin: left center; }
  .answer {
    flex: none;
    height: 58px;
    margin: 0;
    display: grid;
    place-items: center;
    font-size: 48px;
    font-weight: 700;
    line-height: 1;
    white-space: nowrap;
    overflow: hidden;
    color: #163a86;
  }
  .answer[aria-hidden="true"] { display: none; }
  #answerInner { display: inline-block; transform-origin: center center; }
  #desc {
    flex: none;
    margin: 6px 0 0;
    padding: 0 14px 4px;
    font-size: 38px;
    line-height: 1.15;
    height: calc(38px * 1.15 * 5 + 4px);
    overflow: hidden;
  }
  #desc.hidden { display: none; }
  .hl-water { color: #1d4ed8; font-weight: 700; }
  .hl-result { color: #9a3412; font-weight: 700; }
  .hl-lilac { color: #7e22ce; font-weight: 700; }
  .hl-gold { color: #a16207; font-weight: 700; }
  @media (max-width: 800px) {
    .nav { min-width: 44px; padding: 0 8px; }
    .metal { padding: 0 10px; }
    #desc { height: calc(38px * 1.15 * 8 + 4px); }
    #eqBand.split {
      display: flex;
      flex-direction: column;
      height: calc(24px * 1.25 * 4);
    }
  }
  .pen-canvas { position: fixed; inset: 0; z-index: 40; pointer-events: none; touch-action: none; }
  .laser-canvas { position: fixed; inset: 0; z-index: 45; pointer-events: none; }
  .laser-dot {
    position: fixed; width: 22px; height: 22px; margin: -11px 0 0 -11px;
    border-radius: 50%; pointer-events: none; z-index: 48;
    background: radial-gradient(circle, rgba(255, 60, 60, 0.98), rgba(255, 0, 0, 0) 72%);
  }
  .laser-dot.hidden, .dcolors.hidden { display: none; }
  body.pen-on { cursor: crosshair; touch-action: none; }
  body.pen-on .pen-canvas { pointer-events: auto; }
  body.laser-on { cursor: none; touch-action: none; }
  body.pen-on, body.laser-on { user-select: none; }
  .teach-dock {
    position: fixed; right: 8px; top: 50%; transform: translateY(-50%);
    z-index: 60; display: flex; flex-direction: column; gap: 6px;
    padding: 8px 6px; background: rgba(255, 255, 255, 0.94);
    border: 1px solid #d7e0ec; border-radius: 16px;
  }
  .dbtn {
    width: 44px; height: 44px; border: 0; border-radius: 12px;
    background: transparent; display: grid; place-items: center; color: #111827;
  }
  .dbtn svg { width: 22px; height: 22px; }
  .dbtn.active { background: #163a86; color: #fff; }
  #dkLaser.active { background: #e11d48; }
  #dkPen.active { background: #0f8a62; }
  .dcolors { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .dcolor { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #fff; background: var(--sc); box-shadow: 0 0 0 1px #d7e0ec; }
  .dcolor.active { box-shadow: 0 0 0 2px #111827; }
  .derase.active { background: #d97706; color: #3f2a00; }
</style>

        coilTurns[i].setAttribute('stroke-width', lerp(3.2, 5.4, hot).toFixed(2));
      }
      var glare = smooth(clamp(t, 0.3, 0.46)) * (1 - smooth(clamp(t, 0.64, 0.86)));
      flash.setAttribute('opacity', (glare * 0.95).toFixed(3));
      hotGlow.setAttribute('fill', '#ffffff');
      hotGlow.setAttribute('opacity', (glare * 0.72).toFixed(3));
      steamAmt = Math.max(smooth(clamp(t, 0.06, 0.28)) * (1 - smooth(clamp(t, 0.78, 0.96))), glare * 0.85);
    } else if (kind === 'zn') {
      var toYellow = smooth(clamp(t, 0.16, 0.38));
      var toWhite = smooth(clamp(t, 0.58, 0.94));
      var znFill = rgb(mix(mix([156, 163, 175], [250, 204, 21], toYellow), [248, 250, 252], toWhite));
      for (var z = 0; z < powderNodes.length; z++) powderNodes[z].setAttribute('fill', znFill);
      hotGlow.setAttribute('fill', '#fde68a');
      hotGlow.setAttribute('opacity', (toYellow * (1 - toWhite) * 0.5).toFixed(3));
      steamAmt = toYellow * (1 - toWhite);
    } else if (kind === 'fe') {
      var glowIn = smooth(clamp(t, 0.12, 0.32));
      var glowOut = smooth(clamp(t, 0.5, 0.78));
      var glow = glowIn * (1 - glowOut);
      var feFill = rgb(mix([156, 163, 175], [17, 24, 39], smooth(clamp(t, 0.3, 0.9))));
      for (var f = 0; f < powderNodes.length; f++) powderNodes[f].setAttribute('fill', feFill);
      hotGlow.setAttribute('fill', '#c2410c');
      hotGlow.setAttribute('opacity', (glow * 0.5).toFixed(3));
      steamAmt = glow;
    } else {
      var warm = Math.sin(Math.PI * clamp(t, 0.08, 0.94));
      alBody.setAttribute('fill', rgb(mix([156, 163, 175], [214, 170, 142], warm * 0.8)));
      hotGlow.setAttribute('fill', '#fdba74');
      hotGlow.setAttribute('opacity', (warm * 0.2).toFixed(3));
      steamAmt = warm * 0.85;
    }
    drawWisps(t, steamAmt);
  }
  function draw(metal, t) {
    if (metal.kind === 'alkali') drawAlkali(metal, t);
    else if (metal.kind === 'sink' || metal.kind === 'inert') drawSink(metal, t);
    else drawSteam(metal, t);
  }
  function play(metal) {
    playToken += 1;
    var token = playToken;
    if (reduceMotion) {
      draw(metal, 1);
      return;
    }
    var t0 = performance.now();
    function frame(now) {
      if (token !== playToken) return;
      var t = Math.min(1, (now - t0) / metal.dur);
      draw(metal, t);
      if (t < 1) requestAnimationFrame(frame);
    }
    draw(metal, 0);
    requestAnimationFrame(frame);
  }
  function showMetal(id) {
    var metal = byId[id];
    if (!metal) return;
    currentId = id;
    for (var i = 0; i < metalButtons.length; i++) {
      metalButtons[i].setAttribute('aria-pressed', metalButtons[i].getAttribute('data-id') === id ? 'true' : 'false');
    }
    stageName.textContent = metal.name;
    desc.innerHTML = metal.desc;
    fig.setAttribute('aria-label', metal.aria);
    fig.setAttribute('viewBox', metal.scene === 'water' ? '300 0 1180 400' : '0 0 1500 400');
    waterG.setAttribute('display', metal.scene === 'water' ? 'inline' : 'none');
    steamG.setAttribute('display', metal.scene === 'steam' ? 'inline' : 'none');
    alkaliMove.setAttribute('display', metal.kind === 'alkali' ? 'inline' : 'none');
    sinker.setAttribute('display', (metal.kind === 'sink' || metal.kind === 'inert') ? 'inline' : 'none');
    coil.setAttribute('display', metal.kind === 'ribbon' ? 'inline' : 'none');
    powder.setAttribute('display', (metal.kind === 'zn' || metal.kind === 'fe') ? 'inline' : 'none');
    alSolid.setAttribute('display', metal.kind === 'oxide' ? 'inline' : 'none');
    if (metal.kind === 'alkali') {
      flameOuter.setAttribute('fill', metal.flame);
      flameCore.setAttribute('fill', metal.flameCore);
    }
    if (metal.solidLabel && metalInTube.textContent !== metal.solidLabel) metalInTube.textContent = metal.solidLabel;
    var eqs = metal.eqs || [];
    eqBand.classList.toggle('split', eqs.length > 2);
    eqBand.hidden = eqs.length === 0;
    for (var eqi = 0; eqi < eqInners.length; eqi++) {
      eqInners[eqi].textContent = eqs[eqi] || '';
      eqInners[eqi].parentElement.hidden = !eqs[eqi];
    }
    var showAns = !!metal.answer;
    answer.setAttribute('aria-hidden', showAns ? 'false' : 'true');
    answerInner.textContent = showAns ? metal.answer : '';
    fitName();
    fitEqs();
    fitAnswer();
    if (zoomed) fitZoom();
    play(metal);
  }

  document.getElementById('metalList').addEventListener('click', function (e) {
    var btn = e.target.closest('.metal');
    if (!btn) return;
    showMetal(btn.getAttribute('data-id'));
  });
  document.getElementById('watchBtn').addEventListener('click', function () {
    showMetal(currentId);
  });

  function setDesc(show) {
    descHidden = !show;
    desc.classList.toggle('hidden', descHidden);
    hideBtn.textContent = descHidden ? 'Show' : 'Hide';
    hideBtn.setAttribute('aria-pressed', descHidden ? 'true' : 'false');
  }
  hideBtn.addEventListener('click', function () { setDesc(descHidden); });

  function placeZoom() {
    if (!zoomed) {
      stage.style.top = '';
      stage.style.left = '';
      stage.style.right = '';
      stage.style.bottom = '';
      return;
    }
    var top = document.querySelector('.topbar').offsetHeight + document.getElementById('metalList').offsetHeight;
    stage.style.top = top + 'px';
    stage.style.left = '8px';
    stage.style.right = '72px';
    stage.style.bottom = '8px';
  }
  function fitZoom() {
    zoomFit.style.transform = '';
    if (!zoomed) return;
    var haveH = zoomFit.clientHeight;
    var needH = zoomFit.scrollHeight;
    var haveW = zoomFit.clientWidth;
    var needW = zoomFit.scrollWidth;
    if (!needH || !needW) return;
    var scale = Math.min(1, haveH / needH, haveW / needW);
    if (scale < 0.99) {
      zoomFit.style.transformOrigin = 'top center';
      zoomFit.style.transform = 'scale(' + scale + ')';
    }
  }
  zoomBtn.addEventListener('click', function () {
    zoomed = !zoomed;
    document.body.classList.toggle('zoomed', zoomed);
    zoomBtn.setAttribute('aria-pressed', zoomed ? 'true' : 'false');
    placeZoom();
    requestAnimationFrame(function () {
      fitZoom();
      fitName();
      fitEqs();
      fitAnswer();
    });
  });

  function resizeCanvas(c) {
    var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    var cssW = window.innerWidth;
    var cssH = window.innerHeight;
    var w = Math.round(cssW * dpr);
    var h = Math.round(cssH * dpr);
    c.style.width = cssW + 'px';
    c.style.height = cssH + 'px';
    if (c.width === w && c.height === h) return;
    c.width = w;
    c.height = h;
    c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function wipe(c) {
    var ctx = c.getContext('2d');
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.restore();
  }
  function setPen(on) {
    if (on) {
      laserOn = false;
      document.body.classList.remove('laser-on');
      document.getElementById('dkLaser').classList.remove('active');
      laserDot.classList.add('hidden');
    }
    penOn = on;
    document.body.classList.toggle('pen-on', on);
    document.getElementById('dkPen').classList.toggle('active', on);
    document.getElementById('dkColors').classList.toggle('hidden', !on);
    if (!on) {
      erasing = false;
      document.getElementById('dkErase').classList.remove('active');
    }
  }
  function setLaser(on) {
    if (on) setPen(false);
    laserOn = on;
    document.body.classList.toggle('laser-on', on);
    document.getElementById('dkLaser').classList.toggle('active', on);
    if (!on) laserDot.classList.add('hidden');
    else if (hasPointer) laserDot.classList.remove('hidden');
    if (on && !laserRunning) {
      laserRunning = true;
      lastFrame = 0;
      requestAnimationFrame(laserFrame);
    }
  }
  document.getElementById('dkPen').addEventListener('click', function () { setPen(!penOn); });
  document.getElementById('dkLaser').addEventListener('click', function () { setLaser(!laserOn); });
  document.getElementById('dkErase').addEventListener('click', function () {
    erasing = !erasing;
    document.getElementById('dkErase').classList.toggle('active', erasing);
  });
  document.getElementById('dkColors').addEventListener('click', function (e) {
    var btn = e.target.closest('.dcolor');
    if (!btn) return;
    ink = btn.dataset.c;
    erasing = false;
    document.getElementById('dkErase').classList.remove('active');
    document.querySelectorAll('.dcolor').forEach(function (el) {
      el.classList.toggle('active', el === btn);
    });
  });
  document.getElementById('dkClear').addEventListener('click', function () {
    inkStrokes = [];
    openStroke = null;
    wipe(penCanvas);
    wipe(laserCanvas);
  });
  function paintSeg(erase, color, a, b) {
    penCtx.lineCap = 'round';
    penCtx.lineJoin = 'round';
    if (erase) {
      penCtx.globalCompositeOperation = 'destination-out';
      penCtx.strokeStyle = 'rgba(0,0,0,1)';
      penCtx.lineWidth = 26;
    } else {
      penCtx.globalCompositeOperation = 'source-over';
      penCtx.strokeStyle = color;
      penCtx.lineWidth = 3.6;
    }
    penCtx.beginPath();
    penCtx.moveTo(a.x, a.y);
    penCtx.lineTo(b.x, b.y);
    penCtx.stroke();
  }
  function redrawInk() {
    var s, i;
    wipe(penCanvas);
    for (s = 0; s < inkStrokes.length; s++) {
      var strokeObj = inkStrokes[s];
      if (strokeObj.pts.length === 1) paintSeg(strokeObj.erase, strokeObj.color, strokeObj.pts[0], strokeObj.pts[0]);
      for (i = 1; i < strokeObj.pts.length; i++) {
        paintSeg(strokeObj.erase, strokeObj.color, strokeObj.pts[i - 1], strokeObj.pts[i]);
      }
    }
  }
  penCanvas.addEventListener('pointerdown', function (e) {
    if (!penOn) return;
    try { penCanvas.setPointerCapture(e.pointerId); } catch (err) {}
    drawing = true;
    lastPt = { x: e.clientX, y: e.clientY };
    openStroke = { erase: erasing, color: ink, pts: [lastPt] };
    inkStrokes.push(openStroke);
    paintSeg(erasing, ink, lastPt, lastPt);
  });
  penCanvas.addEventListener('pointermove', function (e) {
    if (!drawing) return;
    var p = { x: e.clientX, y: e.clientY };
    if (openStroke) openStroke.pts.push(p);
    paintSeg(erasing, ink, lastPt, p);
    lastPt = p;
  });
  function endDraw() {
    drawing = false;
    openStroke = null;
  }
  penCanvas.addEventListener('pointerup', endDraw);
  penCanvas.addEventListener('pointercancel', endDraw);
  document.addEventListener('pointermove', function (e) {
    laserX = e.clientX;
    laserY = e.clientY;
    hasPointer = true;
    if (!laserOn) return;
    laserDot.style.left = laserX + 'px';
    laserDot.style.top = laserY + 'px';
    laserDot.classList.remove('hidden');
  });
  document.addEventListener('pointerleave', function () {
    hasPointer = false;
    laserDot.classList.add('hidden');
  });
  function laserFrame(now) {
    if (!laserOn) {
      laserRunning = false;
      wipe(laserCanvas);
      return;
    }
    var dt = lastFrame ? Math.min(40, now - lastFrame) : 16;
    lastFrame = now;
    laserCtx.save();
    laserCtx.setTransform(1, 0, 0, 1, 0, 0);
    laserCtx.globalCompositeOperation = 'destination-out';
    laserCtx.fillStyle = 'rgba(0,0,0,' + (dt / 1600) + ')';
    laserCtx.fillRect(0, 0, laserCanvas.width, laserCanvas.height);
    laserCtx.restore();
    if (hasPointer) {
      laserCtx.globalCompositeOperation = 'source-over';
      laserCtx.fillStyle = 'rgba(255,40,40,0.7)';
      laserCtx.beginPath();
      laserCtx.arc(laserX, laserY, 5, 0, Math.PI * 2);
      laserCtx.fill();
    }
    requestAnimationFrame(laserFrame);
  }
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { setPen(false); setLaser(false); }
  });

  window.addEventListener('resize', function () {
    resizeCanvas(penCanvas);
    resizeCanvas(laserCanvas);
    redrawInk();
    placeZoom();
    fitZoom();
    fitName();
    fitEqs();
    fitAnswer();
  });

  setDesc(!window.matchMedia('(max-width: 800px)').matches);
  resizeCanvas(penCanvas);
  resizeCanvas(laserCanvas);
  showMetal('K');
  requestAnimationFrame(function () {
    fitName();
    fitEqs();
    fitAnswer();
  });
})();
</script>
</body>
</html>
