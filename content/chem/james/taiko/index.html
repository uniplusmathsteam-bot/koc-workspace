<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>打太鼓</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div>
        <p class="kicker" id="header-kicker">學習重點</p>
        <h1 id="header-title">打太鼓</h1>
        <p id="header-lead">看例句，敲鼓上正確的手法。音符從右向左，重合判定圈時敲咚／咔／大。1 或 F 咚，2 或 J 咔，3 或空白鍵大。Esc 回主頁。</p>
      </div>
      <div class="top-side">
        <div id="hud" class="hud" hidden></div>
        <nav class="nav">
          <button type="button" class="btn btn-ghost" id="btn-mute" hidden>靜音</button>
          <button type="button" class="btn btn-ghost" id="btn-pause" hidden>暫停</button>
          <button type="button" class="btn btn-ghost" id="btn-home" hidden>主頁</button>
        </nav>
      </div>
    </div>
  </header>

  <main>
    <section class="view active" id="hub"></section>
    <section class="view" id="study"></section>
    <section class="view" id="play"></section>
    <section class="view" id="recap"></section>
  </main>

  <div id="leave-overlay" class="overlay" hidden>
    <div class="overlay-card" role="dialog" aria-modal="true" aria-labelledby="leave-title">
      <p id="leave-title">本局尚未完成，確定回主頁？</p>
      <div class="overlay-actions">
        <button type="button" class="btn" id="leave-stay">留下</button>
        <button type="button" class="btn btn-ghost" id="leave-home">回主頁</button>
      </div>
    </div>
  </div>

  <div id="pause-overlay" class="overlay" hidden>
    <div class="overlay-card" role="dialog" aria-modal="true" aria-labelledby="pause-title">
      <p id="pause-title">已暫停</p>
      <div class="overlay-actions">
        <button type="button" class="btn" id="pause-resume">繼續</button>
        <button type="button" class="btn btn-ghost" id="pause-home">回主頁</button>
      </div>
    </div>
  </div>

  <div id="howto-overlay" class="overlay" hidden>
    <div class="overlay-card overlay-card-wide" role="dialog" aria-modal="true" aria-labelledby="howto-title">
      <p id="howto-title">怎麼玩</p>
      <ol class="howto-list" id="howto-list"></ol>
      <div class="overlay-actions">
        <button type="button" class="btn" id="howto-close">知道了</button>
      </div>
    </div>
  </div>

  <canvas id="confetti" aria-hidden="true"></canvas>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
