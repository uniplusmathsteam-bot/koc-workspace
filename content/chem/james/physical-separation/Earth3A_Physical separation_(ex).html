<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Earth3A Physical separation — fractional distillation</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #111827;
    background: #eef3f8;
    padding-left: env(safe-area-inset-left);
    padding-right: calc(64px + env(safe-area-inset-right));
    padding-bottom: env(safe-area-inset-bottom);
  }
  button { font-family: inherit; cursor: pointer; }
  .topbar {
    position: relative;
    z-index: 55;
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: calc(52px + env(safe-area-inset-top));
    padding: env(safe-area-inset-top) 12px 0;
  }
  .topbar h1 {
    flex: 1;
    min-width: 0;
    margin: 0;
    font-size: 18px;
    font-weight: 650;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #stepLabel { flex-shrink: 0; font-size: 16px; color: #334155; white-space: nowrap; }
  .nav {
    min-width: 64px;
    min-height: 44px;
    padding: 0 12px;
    border: 1px solid #d7e0ec;
    border-radius: 10px;
    background: #fff;
    font-size: 16px;
  }
  .nav:disabled { opacity: 0.35; cursor: default; }
  #checkBtn[aria-pressed="true"] { background: #163a86; color: #fff; }
  main {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 8px 12px 8px;
    overflow: hidden;
  }
  #stage {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: #fff;
    border: 1px solid #d7e0ec;
    border-radius: 16px;
    overflow: hidden;
  }
  body.zoomed #stage { position: fixed; z-index: 30; margin: 0; }
  .stage-head {
    flex: none;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    min-height: calc(38px * 1.15 * 2 + 12px);
    padding: 6px 8px 0 14px;
  }
  #stageName {
    flex: 1;
    min-width: 0;
    font-size: 38px;
    font-weight: 650;
    line-height: 1.15;
    color: #111827;
  }
  #zoomBtn {
    flex: none;
    width: 44px;
    height: 44px;
    margin-top: 2px;
    border: 1px solid #d7e0ec;
    border-radius: 10px;
    background: #fff;
    color: #163a86;
    font-size: 28px;
    line-height: 1;
  }
  #zoomBtn[aria-pressed="true"] { background: #163a86; color: #fff; }
  #zoomFit {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  #view {
    position: relative;
    flex: 1;
    min-height: 0;
    touch-action: none;
    user-select: none;
  }
  #c { display: block; width: 100%; height: 100%; }
  #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .plabel {
    position: absolute;
    left: 0;
    top: 0;
    padding: 1px 7px;
    border: 1px solid #d7e0ec;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.94);
    color: #111827;
    font-size: 13px;
    line-height: 1.2;
    white-space: nowrap;
  }
  .answer {
    flex: none;
    height: 58px;
    margin: 0;
    display: grid;
    place-items: center;
    font-size: 48px;
    font-weight: 700;
    line-height: 1;
    white-space: nowrap;
    overflow: hidden;
  }
  .answer[aria-hidden="true"] { visibility: hidden; }
  #answerInner { display: inline-block; transform-origin: center center; }
  .tray {
    flex: none;
    display: grid;
    grid-template-columns: repeat(10, minmax(0, 1fr));
    gap: 6px;
    padding: 6px 8px 8px;
  }
  .chip {
    min-height: 44px;
    padding: 4px 3px;
    border: 1px solid #d7e0ec;
    border-radius: 10px;
    background: #fff;
    color: #111827;
    font-size: 13px;
    line-height: 1.1;
    white-space: normal;
    overflow-wrap: break-word;
    touch-action: none;
    user-select: none;
  }
  .chip.on { border-color: #163a86; background: #e8eefc; font-weight: 650; }
  .chip.hot { background: #dbeafe; }
  #desc {
    flex: none;
    margin: 0;
    font-size: 38px;
    line-height: 1.15;
  }
  #desc.hidden { display: none; }
  .hl-joint { color: #163a86; font-weight: 700; }
  .hl-pos { color: #9a3412; font-weight: 700; }
  .hl-water { color: #2563eb; font-weight: 700; }
  .hl-gran { color: #0f766e; font-weight: 700; }
  .hl-heat { color: #c2410c; font-weight: 700; }
  .hl-bad { color: #b91c1c; font-weight: 700; }
  @media (max-width: 900px) {
    .stage-head { min-height: calc(38px * 1.15 * 3 + 12px); }
    .tray { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  }
  @media (max-width: 560px) {
    .stage-head { min-height: calc(38px * 1.15 * 5 + 12px); }
    .tray { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .chip { font-size: 11px; padding: 4px 1px; }
  }
  @media (max-width: 800px) {
    .topbar h1 { display: none; }
    #stepLabel { flex: 1; text-align: center; }
    .nav { min-width: 44px; padding: 0 8px; }
  }
  .pen-canvas { position: fixed; inset: 0; z-index: 40; pointer-events: none; touch-action: none; }
  .laser-canvas { position: fixed; inset: 0; z-index: 45; pointer-events: none; }
  .laser-dot {
    position: fixed; width: 22px; height: 22px; margin: -11px 0 0 -11px;
    border-radius: 50%; pointer-events: none; z-index: 48;
    background: radial-gradient(circle, rgba(255, 60, 60, 0.98), rgba(255, 0, 0, 0) 72%);
  }
  .laser-dot.hidden, .dcolors.hidden { display: none; }
  body.pen-on { cursor: crosshair; touch-action: none; }
  body.pen-on .pen-canvas { pointer-events: auto; }
  body.laser-on { cursor: none; touch-action: none; }
  body.pen-on, body.laser-on { user-select: none; }
  .teach-dock {
    position: fixed; right: 8px; top: 50%; transform: translateY(-50%);
    z-index: 60; display: flex; flex-direction: column; gap: 6px;
    padding: 8px 6px; background: rgba(255, 255, 255, 0.94);
    border: 1px solid #d7e0ec; border-radius: 16px;
  }
  .dbtn {
    width: 44px; height: 44px; border: 0; border-radius: 12px;
    background: transparent; display: grid; place-items: center; color: #111827;
  }
  .dbtn svg { width: 22px; height: 22px; }
  .dbtn.active { background: #163a86; color: #fff; }
  #dkLaser.active { background: #e11d48; }
  #dkPen.active { background: #0f8a62; }
  .dcolors { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .dcolor { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #fff; background: var(--sc); box-shadow: 0 0 0 1px #d7e0ec; }
  .dcolor.active { box-shadow: 0 0 0 2px #111827; }
  .derase.active { background: #d97706; color: #3f2a00; }
  .modebar {
    flex: none;
    display: flex;
    gap: 6px;
    padding: 6px 12px 0;
  }
  .mode {
    flex: 1;
    min-height: 44px;
    padding: 4px 6px;
    border: 1px solid #d7e0ec;
    border-radius: 10px;
    background: #fff;
    color: #111827;
    font-size: 14px;
    line-height: 1.1;
  }
  .mode.on { background: #163a86; color: #fff; font-weight: 650; }
  .viewbtn {
    flex: none;
    min-width: 44px;
    min-height: 44px;
    padding: 0 10px;
    border: 1px solid #d7e0ec;
    border-radius: 10px;
    background: #fff;
    color: #111827;
    font-size: 14px;
  }
  .viewbtn.on { background: #9f1239; color: #fff; font-weight: 650; }
  #sketch {
    display: none;
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  #sketch .piece { fill: none; stroke: none; }
  #sketch .glass { fill: url(#glassShine); stroke: #1e3a4c; stroke-width: 1.8; stroke-linejoin: round; }
  #sketch .tube { fill: none; stroke: #1e3a4c; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #sketch .shine { fill: none; stroke: rgba(255,255,255,0.95); stroke-width: 2; stroke-linecap: round; }
  #sketch .water { fill: url(#waterFill); stroke: #15627a; stroke-width: 0.6; }
  #sketch .metal { fill: #9aa3ad; stroke: #374151; stroke-width: 1.3; }
  #sketch .leg { fill: none; stroke: #4b5563; stroke-width: 5; stroke-linecap: round; }
  #sketch .ceramic { fill: #f7f3ea; stroke: #57534e; stroke-width: 1.6; stroke-linejoin: round; }
  #sketch .paper { fill: #fffbeb; stroke: #a8a29e; stroke-width: 1.4; stroke-linejoin: round; }
  #sketch .mesh { fill: none; stroke: #6b7280; stroke-width: 1; }
  #sketch .flame { fill: url(#flameGrad); stroke: none; }
  #sketch .flame-core { fill: #fff7c2; stroke: none; }
  #sketch .hole { fill: #1f2937; stroke: none; }
  #sketch .hose { fill: none; stroke: #1d4ed8; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
  #sketch .arrow { fill: #1d4ed8; stroke: none; }
  #sketch .mercury { fill: #dc2626; stroke: none; }
  #sketch .gran { fill: #e7e5e4; stroke: #44403c; stroke-width: 1; }
  #sketch .sand { fill: #c2410c; stroke: #7c2d12; stroke-width: 0.6; }
  #sketch .steam { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 1; }
  #sketch .drop { fill: #1a7a96; stroke: none; }
  #sketch .rod { fill: none; stroke: #d5e4ee; stroke-width: 7; stroke-linecap: round; }
  #sketch text {
    font-family: inherit;
    font-size: 13px;
    font-weight: 650;
    fill: #1f2937;
    stroke: #fff;
    stroke-width: 3px;
    paint-order: stroke fill;
  }
  #sketch .ok .glass,
  #sketch .ok .tube,
  #sketch .ok .ceramic,
  #sketch .ok .metal,
  #sketch .ok .paper,
  #sketch .ok .rod { stroke: #0f766e; }
  body.view2d #sketch { display: block; }
  body.view2d #c,
  body.view2d #labels { visibility: hidden; }
  .tray.cols-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  @media (max-width: 800px) {
    .mode { font-size: 12px; }
  }
  @media (max-width: 560px) {
    .tray.cols-5 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
</style>
</head>
<body>
<header class="topbar">
  <button type="button" class="nav" id="backBtn">Back</button>
  <h1 id="pageTitle">Fractional distillation</h1>
  <span id="stepLabel">Build</span>
  <button type="button" class="nav" id="checkBtn" aria-pressed="false">Check</button>
  <button type="button" class="nav" id="hideBtn" aria-pressed="false">Hide</button>
  <button type="button" class="nav" id="nextBtn">Next</button>
</header>
<div class="modebar" id="modebar">
  <button type="button" class="mode on" data-mode="distil" aria-pressed="true">Fractional distillation</button>
  <button type="button" class="mode" data-mode="filter" aria-pressed="false">Filtration</button>
  <button type="button" class="mode" data-mode="evap" aria-pressed="false">Evaporation</button>
  <button type="button" class="viewbtn on" id="view3d" aria-pressed="true">3D</button>
  <button type="button" class="viewbtn" id="view2d" aria-pressed="false">2D</button>
</div>
<main>
  <section id="stage">
    <div class="stage-head">
      <span id="stageName">Join the quick-fit apparatus.</span>
      <button type="button" id="zoomBtn" aria-label="Zoom" aria-pressed="false">+</button>
    </div>
    <div id="zoomFit">
      <div id="view">
        <canvas id="c" aria-label="Quick-fit fractional distillation bench"></canvas>
        <svg id="sketch" viewBox="0 0 760 480" aria-hidden="true">

            </linearGradient>
            <linearGradient id="waterFill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#7ec8e3"/>
              <stop offset="1" stop-color="#1a7a96"/>

            <radialGradient id="flameGrad" cx="50%" cy="70%" r="65%">

            <g id="sk-residue">
              <circle class="sand" cx="-8" cy="30" r="3.2"/>

          <g class="piece" id="sk-frod" data-id="frod">
            <path class="rod" d="M0,0 L78,168"/>
            <path class="shine" d="M2,6 L74,158"/>

<script src="vendor/three.min.js"></script>
<script>
(function () {
  var GAUZE_Y = 1.18;
  var NECK_Y = 4.05;
  var SIDE_Y = 1.2;
  var SIDE_LEN = 1.7;
  var COND_LEN = 6.2;
  var THERM_TOP = 1.75;
  var THERM_BOT = -0.6;
  var T_SIDE = (THERM_TOP - SIDE_Y) / (THERM_TOP - THERM_BOT);
  var INNER_R = 0.15;
  var JACKET_R = 0.62;
  var NOZZLE_H = 0.5;
  var JACKET_INSET = 0.95;
  var T_BAND = 0.08;
  var MOUTH = new THREE.Vector3(1.15, -2.2, 0);
  var UP = new THREE.Vector3(0, 1, 0);
  var OK = 0x15803d;
  var BAD = 0xb91c1c;
  var sideDir = new THREE.Vector3(1, -0.28, 0).normalize();
  var sideEnd = new THREE.Vector3(0, SIDE_Y, 0).addScaledVector(sideDir, SIDE_LEN);
  var nozzleLocal = {
    nozzleA: new THREE.Vector3(1.2, JACKET_R + NOZZLE_H, 0),
    nozzleB: new THREE.Vector3(COND_LEN - 1.2, -(JACKET_R + NOZZLE_H), 0)
  };
  var REST_Y = {
    flask: 0, granules: 0.15, heat: 0, still: 0, thermo: 0.3,
    condenser: 1.9, win: 0.2, wout: 0.2, adaptor: 2.4, receiver: 0
  };
  var CHILD_OF = {
    flask: ['granules', 'heat', 'still'],
    still: ['thermo', 'condenser'],
    condenser: ['win', 'wout', 'adaptor'],
    adaptor: ['receiver']
  };

  var backBtn = document.getElementById('backBtn');
  var nextBtn = document.getElementById('nextBtn');
  var hideBtn = document.getElementById('hideBtn');
  var checkBtn = document.getElementById('checkBtn');
  var stepLabel = document.getElementById('stepLabel');
  var stage = document.getElementById('stage');
  var stageName = document.getElementById('stageName');
  var zoomBtn = document.getElementById('zoomBtn');
  var zoomFit = document.getElementById('zoomFit');
  var view = document.getElementById('view');
  var canvas = document.getElementById('c');
  var labels = document.getElementById('labels');
  var answer = document.getElementById('answer');
  var answerInner = document.getElementById('answerInner');
  var tray = document.getElementById('tray');
  var desc = document.getElementById('desc');
  var penCanvas = document.getElementById('penCanvas');
  var laserCanvas = document.getElementById('laserCanvas');
  var laserDot = document.getElementById('laserDot');

  var step = -1;
  var zoomed = false;
  var descHidden = false;
  var penOn = false;
  var laserOn = false;
  var erasing = false;
  var ink = '#e11d48';
  var drawing = false;
  var lastPt = null;
  var laserX = 0;
  var laserY = 0;
  var hasPointer = false;
  var lastFrame = 0;
  var laserRunning = false;
  var inkStrokes = [];
  var openStroke = null;
  var undoStack = [];
  var penCtx = penCanvas.getContext('2d');
  var laserCtx = laserCanvas.getContext('2d');
  var drag = null;
  var pending = false;
  var azimuth = 0.62;
  var polar = 1.08;
  var radius = 18;
  var target = new THREE.Vector3(4.1, 3.6, 0);
  var camRight = new THREE.Vector3();
  var camUp = new THREE.Vector3();
  var camPts = {};
  var orbitPtr = null;
  var panPtr = null;
  var pinchPrev = null;
  var flameMesh = null;
  var procT = 0;
  var lastDrawAt = 0;
  var labelsDirty = true;
  var rigMoved = true;
  var runningCached = null;
  var procShown = false;
  var viewW = 0;
  var viewH = 0;
  var viewDpr = 0;
  var cachedLower = null;
  var labelLocal = new THREE.Vector3();
  var nozzleAWorld = new THREE.Vector3();
  var nozzleBWorld = new THREE.Vector3();
  var mouthScratch = new THREE.Vector3();
  var lastMouth = new THREE.Vector3(NaN, NaN, NaN);
  var standParts = [];
  var mode = 'distil';
  var view2d = false;
  var modePieces = {};
  var pageTitle = document.getElementById('pageTitle');

  var META = [
    ['flask', 'flask', 'Pear-shaped flask of sea water'],
    ['granules', 'granules', 'Anti-bumping granules'],
    ['heat', 'heat', 'Heat'],
    ['still', 'still head', 'Still head'],
    ['thermo', 'thermometer', 'Thermometer'],
    ['condenser', 'condenser', 'Condenser'],
    ['win', 'water in', 'Water in'],
    ['wout', 'water out', 'Water out'],
    ['adaptor', 'adaptor', 'Receiver adaptor'],
    ['receiver', 'receiver', 'Receiver for pure water (distillate)']
  ];

  function glassMat() {
    return new THREE.MeshPhongMaterial({
      color: 0xd7eefc,
      transparent: true,
      opacity: 0.4,
      shininess: 90,
      specular: new THREE.Color('white'),
      side: THREE.DoubleSide,
      depthWrite: false,
      emissive: new THREE.Color(0x000000)
    });
  }
  function solidMat(color, extra) {
    var opt = {
      color: color,
      shininess: 40,
      specular: new THREE.Color('white'),
      emissive: new THREE.Color(0x000000)
    };
    if (extra) {
      Object.keys(extra).forEach(function (k) { opt[k] = extra[k]; });
    }
    return new THREE.MeshPhongMaterial(opt);
  }
  function addPart(group, geo, mat, id, mark) {
    var mesh = new THREE.Mesh(geo, mat);
    mesh.userData.pieceId = id;
    mesh.userData.mark = !!mark;
    group.add(mesh);
    return mesh;
  }
  function lathe(pairs) {
    return new THREE.LatheGeometry(pairs.map(function (p) {
      return new THREE.Vector2(p[0], p[1]);
    }), 28);
  }
  function alongX(mesh, length) {
    mesh.rotation.z = -Math.PI / 2;
    mesh.position.x = length / 2;
  }

  var renderer = new THREE.WebGLRenderer({
    canvas: canvas,
    antialias: true,
    powerPreference: 'high-performance',
    stencil: false
  });
  if (THREE.SRGBColorSpace) renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.setClearColor(0xf8fafc, 1);
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(32, 1, 0.1, 80);
  var raycaster = new THREE.Raycaster();
  var pointer = new THREE.Vector2();
  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  scene.add(new THREE.HemisphereLight(0xffffff, 0xcbd5e1, 0.4));
  var sun = new THREE.DirectionalLight(0xffffff, 0.85);
  sun.position.set(7, 14, 9);
  scene.add(sun);

  var bench = new THREE.Mesh(
    new THREE.BoxGeometry(22, 0.28, 12),
    solidMat(0xe7e5e4)
  );
  bench.position.set(4, -0.14, 0);
  bench.matrixAutoUpdate = false;
  bench.updateMatrix();
  scene.add(bench);
  var gauze = new THREE.Mesh(
    new THREE.CylinderGeometry(1.65, 1.65, 0.06, 24),
    solidMat(0x94a3b8)
  );
  gauze.position.y = GAUZE_Y;
  gauze.matrixAutoUpdate = false;
  gauze.updateMatrix();
  scene.add(gauze);
  standParts.push(gauze);
  var legMat = solidMat(0x475569);
  for (var li = 0; li < 3; li++) {
    var leg = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, GAUZE_Y, 8), legMat);
    var ang = li * Math.PI * 2 / 3;
    leg.position.set(Math.cos(ang) * 1.15, GAUZE_Y / 2, Math.sin(ang) * 1.15);
    leg.matrixAutoUpdate = false;
    leg.updateMatrix();
    scene.add(leg);
    standParts.push(leg);
  }

  var pieces = {};
  function makePiece(id) {
    var group = new THREE.Group();
    group.name = id;
    group.visible = false;
    scene.add(group);
    var label = document.createElement('div');
    label.className = 'plabel';
    labels.appendChild(label);
    pieces[id] = {
      id: id,
      group: group,
      labelEl: label,
      place: 'tray',
      socket: null,
      t: T_SIDE,
      slopeUp: false,
      pointUp: false
    };
    return group;
  }

  (function buildFlask() {
    var g = makePiece('flask');
    addPart(g, lathe([
      [0.02, 0], [1.15, 0.02], [1.75, 0.45], [1.95, 1.35], [1.72, 2.25],
      [1.05, 2.9], [0.46, 3.35], [0.36, 3.9], [0.58, 4.02], [0.42, 4.08]
    ]), glassMat(), 'flask', true);
    addPart(g, lathe([
      [0.02, 0.04], [1.0, 0.08], [1.55, 0.5], [1.7, 1.25], [1.45, 2.0], [0.7, 2.2]
    ]), solidMat(0x1a7a96, { transparent: true, opacity: 0.78 }), 'flask', true);
    var skin = addPart(g, new THREE.CircleGeometry(1.35, 24), solidMat(0x7dd3e8, { shininess: 90 }), 'flask', false);
    skin.rotation.x = -Math.PI / 2;
    skin.position.y = 2.2;
  })();

  (function buildGranules() {
    var g = makePiece('granules');
    var mat = solidMat(0xe7e5e4);
    [[0, 0, 0], [0.34, 0.06, 0.12], [-0.28, 0.04, 0.18], [0.1, 0.1, -0.3],
      [-0.2, 0.14, -0.14], [0.24, 0.16, 0.2], [0, 0.2, 0]].forEach(function (p) {
      var s = addPart(g, new THREE.SphereGeometry(0.16, 10, 8), mat, 'granules', true);
      s.position.set(p[0], p[1], p[2]);
    });
  })();

  (function buildHeat() {
    var g = makePiece('heat');
    addPart(g, new THREE.CylinderGeometry(0.78, 0.84, 0.22, 16), solidMat(0x334155), 'heat', true).position.y = 0.11;
    addPart(g, new THREE.CylinderGeometry(0.16, 0.2, 0.72, 12), solidMat(0x1f2937), 'heat', true).position.y = 0.52;
    var flame = addPart(g, new THREE.CylinderGeometry(0.02, 0.36, 0.7, 12), solidMat(0xfde047, { emissive: new THREE.Color(0xf97316) }), 'heat', false);
    flame.position.set(0, 0.86, 0.45);
    flameMesh = flame;
  })();

  (function buildStill() {
    var g = makePiece('still');
    var cone = addPart(g, new THREE.CylinderGeometry(0.4, 0.26, 0.5, 16), glassMat(), 'still', true);
    cone.position.y = 0.25;
    var neck = addPart(g, new THREE.CylinderGeometry(0.28, 0.28, 0.9, 16), glassMat(), 'still', true);
    neck.position.y = 0.95;
    var socket = addPart(g, new THREE.CylinderGeometry(0.24, 0.28, 0.42, 16), glassMat(), 'still', true);
    socket.position.y = SIDE_Y + 0.16;
    var lip = addPart(g, new THREE.CylinderGeometry(0.38, 0.26, 0.14, 16), glassMat(), 'still', true);
    lip.position.y = SIDE_Y + 0.46;
    var armLen = SIDE_LEN - 0.42;
    var arm = addPart(g, new THREE.CylinderGeometry(0.2, 0.2, armLen, 14), glassMat(), 'still', true);
    arm.quaternion.setFromUnitVectors(UP, sideDir);
    arm.position.copy(sideDir.clone().multiplyScalar(armLen / 2));
    arm.position.y += SIDE_Y;
    var cuff = addPart(g, new THREE.CylinderGeometry(0.18, 0.32, 0.42, 14), glassMat(), 'still', true);
    cuff.quaternion.copy(arm.quaternion);
    cuff.position.copy(sideEnd).addScaledVector(sideDir, -0.21);
  })();

  (function buildThermo() {
    var g = makePiece('thermo');
    addPart(g, new THREE.SphereGeometry(0.28, 16, 12), solidMat(0xdc2626), 'thermo', true);
    var stem = addPart(g, new THREE.CylinderGeometry(0.1, 0.1, 3.3, 12), solidMat(0x64748b), 'thermo', true);
    stem.position.y = 1.8;
    var col = addPart(g, new THREE.CylinderGeometry(0.04, 0.04, 1.15, 8), solidMat(0xdc2626), 'thermo', true);
    col.position.y = 0.86;
  })();

  (function buildCondenser() {
    var g = makePiece('condenser');
    var inner = addPart(g, new THREE.CylinderGeometry(INNER_R, INNER_R, COND_LEN, 16), glassMat(), 'condenser', true);
    alongX(inner, COND_LEN);
    var jacketLen = COND_LEN - JACKET_INSET * 2;
    var jacket = addPart(g, new THREE.CylinderGeometry(JACKET_R, JACKET_R, jacketLen, 20), glassMat(), 'condenser', true);
    alongX(jacket, jacketLen);
    jacket.position.x = COND_LEN / 2;
    var inlet = addPart(g, new THREE.CylinderGeometry(0.26, 0.3, 0.5, 16), glassMat(), 'condenser', true);
    inlet.rotation.z = -Math.PI / 2;
    inlet.position.x = 0.1;
    var outlet = addPart(g, new THREE.CylinderGeometry(0.18, 0.28, 0.48, 16), glassMat(), 'condenser', true);
    outlet.rotation.z = -Math.PI / 2;
    outlet.position.x = COND_LEN - 0.04;
    ['nozzleA', 'nozzleB'].forEach(function (name) {
      var n = addPart(g, new THREE.CylinderGeometry(0.1, 0.13, NOZZLE_H, 12), glassMat(), 'condenser', true);
      n.position.copy(nozzleLocal[name]);
      n.position.y -= Math.sign(nozzleLocal[name].y) * (NOZZLE_H / 2);
    });
  })();

  function buildHose(id) {
    var g = makePiece(id);
    var hose = addPart(g, new THREE.CylinderGeometry(0.11, 0.11, 1.7, 12), solidMat(id === 'win' ? 0x2563eb : 0x0369a1), id, true);
    hose.position.y = 0.85;
  }
  buildHose('win');
  buildHose('wout');

  (function buildAdaptor() {
    var g = makePiece('adaptor');
    var run = addPart(g, new THREE.CylinderGeometry(0.24, 0.24, 1.15, 12), glassMat(), 'adaptor', true);
    alongX(run, 1.15);
    var drop = addPart(g, new THREE.CylinderGeometry(0.24, 0.28, 2.2, 12), glassMat(), 'adaptor', true);
    drop.position.set(1.15, -1.1, 0);
  })();

  (function buildReceiver() {
    var g = makePiece('receiver');
    addPart(g, new THREE.SphereGeometry(0.68, 16, 12), glassMat(), 'receiver', true).position.y = 0.4;
    var wall = addPart(g, new THREE.CylinderGeometry(0.68, 0.68, 1.9, 16), glassMat(), 'receiver', true);
    wall.position.y = 1.35;
    var lip = addPart(g, new THREE.CylinderGeometry(0.78, 0.68, 0.12, 16), glassMat(), 'receiver', true);
    lip.position.y = 2.28;
  })();

  var BUBBLES = [];
  var VAPOUR = [];
  var DROPS = [];
  var JACKET = [];
  var COLD_WATER = new THREE.Color(0x2563eb);
  var WARM_WATER = new THREE.Color(0xfdba74);
  var distillate = null;

  (function buildProcess() {
    var bubbleGeo = new THREE.SphereGeometry(0.11, 10, 8);
    var bubbleMat = solidMat(0xecfeff, { transparent: true, opacity: 0.72, depthWrite: false });
    var i;
    for (i = 0; i < 8; i++) {
      var b = addPart(pieces.flask.group, bubbleGeo, bubbleMat, 'flask', false);
      b.name = 'proc-bubble';
      b.visible = false;
      b.userData.ang = i * 2.399;
      b.userData.rad = 0.28 + (i % 3) * 0.28;
      BUBBLES.push(b);
    }
    var vapourGeo = new THREE.SphereGeometry(0.08, 10, 8);
    var vapourMat = solidMat(0xdbeafe, { transparent: true, opacity: 0.9, depthWrite: false });
    function vapourRun(parentId, a, b, count) {
      var k;
      for (k = 0; k < count; k++) {
        var m = addPart(pieces[parentId].group, vapourGeo, vapourMat, parentId, false);
        m.name = 'proc-vapour';
        m.visible = false;
        VAPOUR.push({ mesh: m, a: a.clone(), b: b.clone() });
      }
    }
    vapourRun('flask', new THREE.Vector3(0, 2.25, 0), new THREE.Vector3(0, 3.92, 0), 5);
    vapourRun('still', new THREE.Vector3(0, 0.15, 0), new THREE.Vector3(0, SIDE_Y, 0), 3);
    vapourRun('still', new THREE.Vector3(0, SIDE_Y, 0).addScaledVector(sideDir, 0.2), sideEnd.clone().addScaledVector(sideDir, -0.15), 4);
    vapourRun('condenser', new THREE.Vector3(0.35, 0, 0), new THREE.Vector3(COND_LEN - 0.2, 0, 0), 5);
    var dropGeo = new THREE.SphereGeometry(0.07, 10, 8);
    var dropMat = solidMat(0xbae6fd, { transparent: true, opacity: 0.95, depthWrite: false });
    for (i = 0; i < 6; i++) {
      var d = addPart(pieces.condenser.group, dropGeo, dropMat, 'condenser', false);
      d.name = 'proc-drop';
      d.visible = false;
      DROPS.push(d);
    }
    var flowGeo = new THREE.SphereGeometry(0.055, 8, 6);
    var flowMat = solidMat(0x2563eb, { transparent: true, opacity: 0.95 });
    for (i = 0; i < 12; i++) {
      var f = addPart(pieces.condenser.group, flowGeo, flowMat.clone(), 'condenser', false);
      f.name = 'proc-flow';
      f.visible = false;
      f.userData.ang = i * (Math.PI * 2 / 12);
      f.userData.rad = 0.28 + (i % 3) * 0.1;
      JACKET.push(f);
    }
    var distGeo = new THREE.CylinderGeometry(0.52, 0.52, 1.45, 24);
    distGeo.translate(0, 0.725, 0);
    distillate = addPart(
      pieces.receiver.group,
      distGeo,
      solidMat(0x7dd3fc, { transparent: true, opacity: 0.92, depthWrite: false }),
      'receiver',
      false
    );
    distillate.name = 'proc-distillate';
    distillate.position.y = 0.15;
    distillate.scale.y = 0.12;
    distillate.visible = false;
  })();

  META.forEach(function (row) {
    pieces[row[0]].labelEl.textContent = row[1];
    var chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip';
    chip.innerHTML = row[0] === 'thermo' ? 'thermo<br>meter' : row[1];
    chip.setAttribute('aria-label', row[2]);
    chip.dataset.id = row[0];
    tray.appendChild(chip);
    pieces[row[0]].chip = chip;
  });

  var resLabel = document.createElement('div');
  resLabel.className = 'plabel';
  resLabel.textContent = 'residue';
  resLabel.style.display = 'none';
  labels.appendChild(resLabel);
  var filLabel = document.createElement('div');
  filLabel.className = 'plabel';
  filLabel.textContent = 'filtrate';
  filLabel.style.display = 'none';
  labels.appendChild(filLabel);

  var evapSteam = [];
  var evapFlame = null;
  var evapSeaMesh = null;
  var filtDrops = [];
  var filtResidue = [];
  var filtLiquid = null;
  var MODE_REST = {
    etripod: 0, egauze: 0, edish: 0, esea: 0.15, eheat: 0,
    fbeaker: 0, ffunnel: 0, fpaper: 0.15, frod: 0.2, fmix: 0
  };
  var MODE_CHILD = {
    etripod: ['egauze', 'eheat'],
    egauze: ['edish'],
    edish: ['esea'],
    fbeaker: ['ffunnel'],
    ffunnel: ['fpaper', 'frod', 'fmix'],
    frod: ['fmix']
  };
  var MODE_INFO = {
    distil: {
      title: 'Fractional distillation',
      canvas: 'Quick-fit fractional distillation bench',
      desc: 'Fractional distillation is a method to obtain <span class="hl-water">pure water</span> from sea water. (Obtain solvent from solution)'
    },
    filter: {
      title: 'Filtration',
      canvas: 'Filtration bench',
      desc: 'Filtration separates <span class="hl-pos">sand</span> from sea water. (Insoluble solid from a liquid)'
    },
    evap: {
      title: 'Evaporation',
      canvas: 'Evaporation bench',
      desc: 'Evaporation obtains <span class="hl-pos">salt</span> from sea water. (Obtain the solute from a solution)'
    }
  };

  function makeModePiece(id, modeName) {
    var group = new THREE.Group();
    group.name = id;
    group.visible = false;
    scene.add(group);
    var label = document.createElement('div');
    label.className = 'plabel';
    label.style.display = 'none';
    labels.appendChild(label);
    modePieces[id] = {
      id: id,
      modeName: modeName,
      group: group,
      labelEl: label,

  function evapGap() {

  function filtGap() {

    if (modePieces.fpaper.socket !== 'cone') return 'paper';

    if (mode === 'evap') return evapGap();

  function modeSocket(id, parentId, pos, quat, socket) {

  function filtEase(u) {
    if (u < 0) u = 0;
    if (u > 1) u = 1;

    p.settle = {

      toQ: quat ? quat.clone() : new THREE.Quaternion(),

  function filtStepSettle(dt) {
    var ids = ['fbeaker', 'ffunnel', 'fpaper', 'frod', 'fmix'];
    var moving = false;
    var i;
    for (i = 0; i < ids.length; i++) {
      var p = modePieces[ids[i]];
      var s = p.settle;
      if (!s) continue;
      s.t += dt / 0.42;
      if (s.t >= 1) {
        p.group.position.copy(s.toP);
        p.group.quaternion.copy(s.toQ);
        p.settle = null;
      } else {
        p.group.position.lerpVectors(s.fromP, s.toP, filtEase(s.t));
        p.group.quaternion.copy(s.fromQ).slerp(s.toQ, filtEase(s.t));
        moving = true;
      }
    }
    if (moving) labelsDirty = true;
    return moving;
  }

  function modeNearest(id) {

    }
    if (mode === 'evap') {

      else if (id === 'egauze' && modePieces.etripod.socket === 'stand') {

    } else if (mode === 'filter') {
      if (id === 'fbeaker') keep(rayDistTo(new THREE.Vector3(0.4, 1, 0)), 2.6, filtAttachBeaker);
      else if (id === 'ffunnel' && modePieces.fbeaker.socket === 'bench') {
        keep(rayDistTo(worldOf(modePieces.fbeaker.group, new THREE.Vector3(0, 2.7, 0))), 2.3, filtAttachFunnel);
      } else if (id === 'fpaper' && modePieces.ffunnel.socket === 'in') {
        keep(rayDistTo(worldOf(modePieces.ffunnel.group, new THREE.Vector3(0, 1.7, 0))), 1.8, filtAttachPaper);
      } else if (id === 'frod' && modePieces.fpaper.socket === 'cone') {

      } else if (id === 'fmix' && modePieces.frod.socket === 'guide') {
        keep(rayDistTo(worldOf(modePieces.ffunnel.group, new THREE.Vector3(-1.7, 2.9, 0))), 2.4, filtAttachMix);

  function modeGlow(id, hex) {

  function modePaint() {
    modeClearGlow();
    if (step < 0) return;
    var rows;
    if (mode === 'evap') {
      rows = [
        ['etripod', modePieces.etripod.socket === 'stand'],
        ['egauze', modePieces.egauze.socket === 'top'],
        ['edish', modePieces.edish.socket === 'gauze'],
        ['esea', modePieces.esea.socket === 'in'],
        ['eheat', modePieces.eheat.socket === 'under']
      ];
    } else if (mode === 'filter') {
      rows = [
        ['ffunnel', modePieces.ffunnel.socket === 'in'],
        ['fpaper', modePieces.fpaper.socket === 'cone'],
        ['frod', modePieces.frod.socket === 'guide'],
        ['fmix', modePieces.fmix.socket === 'pour'],
        ['fpaper', modePieces.fmix.socket === 'pour']
      ];
    }
    if (step >= rows.length) {
      var good = modeAllCorrect();
      rows.forEach(function (row) { modeGlow(row[0], good ? OK : BAD); });
      return;
    }
    modeGlow(rows[step][0], rows[step][1] ? OK : BAD);
  }

      var on = p.place !== 'tray';
      p.chip.classList.toggle('on', on);
      p.chip.classList.toggle('hot', drag && drag.id === id && drag.active);
      p.chip.setAttribute('aria-pressed', on ? 'true' : 'false');
    });

  function modeShowStep() {
    var n = modeContentSteps();
    var total = n + 1;
    checkBtn.setAttribute('aria-pressed', step >= 0 ? 'true' : 'false');
    if (step < 0) {
      stageName.textContent = modeBuildText();
      answer.setAttribute('aria-hidden', 'true');
      answerInner.innerHTML = '';
      stepLabel.textContent = 'Build';
      backBtn.disabled = true;
      nextBtn.disabled = true;
    } else if (step < n) {
      stageName.innerHTML = modeMark(step);
      answer.setAttribute('aria-hidden', 'true');
      answerInner.innerHTML = '';
      stepLabel.textContent = (step + 1) + ' / ' + total;
      backBtn.disabled = false;
      nextBtn.disabled = false;
    } else {
      var verdict = modeVerdict();
      stageName.innerHTML = verdict;
      answerInner.innerHTML = verdict;
      answer.setAttribute('aria-hidden', 'false');
      stepLabel.textContent = total + ' / ' + total;
      backBtn.disabled = false;
      nextBtn.disabled = true;
    }
    modePaint();
    modeUpdateChips();
    fitAnswer();
    requestRender();
    sketchSync();

    else if (id === 'fmix') labelLocal.set(-1.1, 1.4, 0);

  function placeHtmlLabel(el, world) {
    var w = view.clientWidth;
    var h = view.clientHeight;
    var pos = world.clone().project(camera);
    if (pos.z > 1) {
      el.style.display = 'none';
      return;
    }
    var x = Math.max(44, Math.min(w - 44, (pos.x * 0.5 + 0.5) * w));
    var y = Math.max(26, Math.min(h - 8, (-pos.y * 0.5 + 0.5) * h));
    el.style.display = 'block';
    el.style.transform = 'translate(' + x + 'px,' + y + 'px) translate(-50%, -100%)';
  }

  function modeUpdateLabels() {
    var w = view.clientWidth;
    var h = view.clientHeight;
    var items = [];
    Object.keys(modePieces).forEach(function (id) {
      var p = modePieces[id];
      if (p.modeName !== mode || p.place === 'tray' || !p.group.visible) {
        p.labelEl.style.display = 'none';
        return;
      }
      var pos = modeLabelAnchor(id);
      pos.project(camera);
      if (pos.z > 1) {
        p.labelEl.style.display = 'none';
        return;
      }
      items.push({
        el: p.labelEl,
        x: (pos.x * 0.5 + 0.5) * w,
        y: (-pos.y * 0.5 + 0.5) * h
      });
    });
    items.sort(function (a, b) { return a.y - b.y || a.x - b.x; });
    for (var i = 1; i < items.length; i++) {
      if (Math.abs(items[i].x - items[i - 1].x) < 72 && items[i].y - items[i - 1].y < 18) {
        items[i].y = items[i - 1].y + 18;
      }
    }
    items.forEach(function (it) {
      var x = Math.max(44, Math.min(w - 44, it.x));
      var y = Math.max(26, Math.min(h - 8, it.y));
      it.el.style.display = 'block';
      it.el.style.transform = 'translate(' + x + 'px,' + y + 'px) translate(-50%, -100%)';
    });
    var showProducts = mode === 'filter' && modePieces.fmix.socket === 'pour';
    if (!showProducts) {
      resLabel.style.display = 'none';
      filLabel.style.display = 'none';

        filtDrops[i].material.opacity = 0.9 * fade;

      var rs = filtEase(Math.min(1, procT / 1.1));
      for (i = 0; i < filtResidue.length; i++) filtResidue[i].scale.setScalar(Math.max(0.001, rs));
      if (filtLiquid) {
        var fs = filtEase(Math.min(1, procT / 5));

        filtLiquid.position.y = 0.095 + 0.525 * fs;

    }
  }
