    }
    for (i = 0; i < dropBits.length; i++) {
      u = (sketchT * 0.5 + i / dropBits.length) % 1;
      fade = loopFade(u);
      dropBits[i].setAttribute('cy', String(78 + filtEase(u) * 50));
      dropBits[i].setAttribute('opacity', String(fade));
    }
    if (distillEl && running) {
      u = filtEase(Math.min(1, sketchT / 4));
      var h = 6 + u * 30;
      distillEl.setAttribute('height', String(h));
      distillEl.setAttribute('y', String(76 - h));
    }
    if (running) requestRender();
  }

  function setView(two) {
    if (view2d === two) return;
    view2d = two;
    document.body.classList.toggle('view2d', two);
    document.getElementById('view3d').classList.toggle('on', !two);
    document.getElementById('view2d').classList.toggle('on', two);
    document.getElementById('view3d').setAttribute('aria-pressed', two ? 'false' : 'true');
    document.getElementById('view2d').setAttribute('aria-pressed', two ? 'true' : 'false');
    sketchSync();
    if (!two) requestRender();
  }

  document.getElementById('view3d').addEventListener('click', function () { setView(false); });
  document.getElementById('view2d').addEventListener('click', function () { setView(true); });
  sketchEl.addEventListener('pointerdown', function (e) {
    if (!view2d || penOn || laserOn) return;
    var g = e.target.closest('[data-id]');
    if (!g) return;
    e.preventDefault();
    var id = g.getAttribute('data-id');
    if (!pieceRec(id) || pieceRec(id).place === 'tray') return;
    sketchDrag = {
      id: id,
      pointerId: e.pointerId,
      sx: e.clientX,
      sy: e.clientY,
      fromTray: false,
      moved: false
    };
  });

  function modeForce() {
    if (mode === 'evap') {
      evapAttachTripod();
      evapAttachGauze();
      evapAttachDish();
      evapAttachSea();
      evapAttachHeat();
    } else if (mode === 'filter') {
      filtAttachBeaker();
      filtAttachFunnel();
      filtAttachPaper();
      filtAttachRod();
      filtAttachMix();
    }
    runningCached = null;
    step = -1;
    showStep();
  }

  function modeUserDrag(id, x, y, z) {
    var chip = modePieces[id].chip;
    var r = chip.getBoundingClientRect();
    var s = screenOf(new THREE.Vector3(x, y, z));
    var pid = 11;
    chip.dispatchEvent(new PointerEvent('pointerdown', {
      bubbles: true, cancelable: true, clientX: r.x + 8, clientY: r.y + 10, pointerId: pid, pointerType: 'mouse'
    }));
    window.dispatchEvent(new PointerEvent('pointermove', {
      bubbles: true, cancelable: true, clientX: s.x, clientY: s.y, pointerId: pid, pointerType: 'mouse'
    }));
    window.dispatchEvent(new PointerEvent('pointerup', {
      bubbles: true, cancelable: true, clientX: s.x, clientY: s.y, pointerId: pid, pointerType: 'mouse'
    }));
    return modePieces[id].socket;
  }

  window.__modes = {
    set: setMode,
    force: modeForce,
    drag: modeUserDrag,
    gap: modeGap,
    all: modeAllCorrect,
    mark: function () { return stageName.innerHTML; },
    mode: function () { return mode; },
    go: function (n) { step = n; showStep(); },
    sockets: function () {
      var out = {};
      Object.keys(modePieces).forEach(function (id) {
        if (modePieces[id].modeName === mode) out[id] = modePieces[id].socket;
      });
      return out;
    }
  };

  function clampRadius(r) {
    if (r < 8) return 8;
    if (r > 36) return 36;
    return r;
  }

  function clampPolar(p) {
    var min = 0.12;
    var max = Math.PI - 0.12;
    if (p < min) return min;
    if (p > max) return max;
    return p;
  }

  function applyCamera() {
    var sp = Math.sin(polar);
    camera.position.set(
      target.x + radius * sp * Math.sin(azimuth),
      target.y + radius * Math.cos(polar),
      target.z + radius * sp * Math.cos(azimuth)
    );
    camera.lookAt(target);
    labelsDirty = true;
  }

  function touchView() {
    labelsDirty = true;
    cachedLower = null;
    rigMoved = true;
    runningCached = null;
  }

  function panBy(dx, dy) {
    var el = camera.matrix.elements;
    camRight.set(el[0], el[1], el[2]);
    camUp.set(el[4], el[5], el[6]);
    var scale = radius * 0.0015;
    target.addScaledVector(camRight, -dx * scale);
    target.addScaledVector(camUp, dy * scale);
  }

  function camCount() {
    var n = 0;
    var k;
    for (k in camPts) n += 1;
    return n;
  }

  function pinchMeasure() {
    var list = [];
    var k;
    for (k in camPts) list.push(camPts[k]);
    if (list.length < 2) return null;
    var dx = list[0].x - list[1].x;
    var dy = list[0].y - list[1].y;
    return {
      dist: Math.max(8, Math.sqrt(dx * dx + dy * dy)),
      mx: (list[0].x + list[1].x) / 2,
      my: (list[0].y + list[1].y) / 2
    };
  }

  function requestRender() {
    if (pending) return;
    pending = true;
    requestAnimationFrame(draw);
  }

  function lowerNozzle() {
    if (cachedLower) return cachedLower;
    pieces.condenser.group.updateMatrixWorld(true);
    pieces.condenser.group.localToWorld(nozzleAWorld.copy(nozzleLocal.nozzleA));
    pieces.condenser.group.localToWorld(nozzleBWorld.copy(nozzleLocal.nozzleB));
    cachedLower = nozzleAWorld.y <= nozzleBWorld.y ? 'nozzleA' : 'nozzleB';
    return cachedLower;
  }

  function adaptorMouthWorld() {
    pieces.adaptor.group.updateMatrixWorld(true);
    return pieces.adaptor.group.localToWorld(mouthScratch.copy(MOUTH));
  }

  function positionReceiver() {
    var mouth = adaptorMouthWorld();
    if (mouth.distanceToSquared(lastMouth) < 1e-6 && pieces.receiver.group.parent === scene) return;
    lastMouth.copy(mouth);
    var h = 2.36;
    scene.attach(pieces.receiver.group);
    pieces.receiver.group.position.set(mouth.x, Math.max(0, mouth.y - h - 0.06), mouth.z);
    pieces.receiver.group.quaternion.identity();
    pieces.receiver.group.visible = true;
    labelsDirty = true;
  }

  function setWorldQuat(obj, worldQ) {
    obj.parent.updateMatrixWorld(true);
    var parentQ = new THREE.Quaternion();
    obj.parent.getWorldQuaternion(parentQ);
    obj.quaternion.copy(parentQ.invert().multiply(worldQ));
  }

  function axisQuat(dir) {
    var x = dir.clone().normalize();
    var z = new THREE.Vector3().crossVectors(x, UP);
    if (z.lengthSq() < 1e-8) z.set(0, 0, 1);
    z.normalize();
    var y = new THREE.Vector3().crossVectors(z, x).normalize();
    return new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(x, y, z));
  }

  function orientFree(id) {
    var g = pieces[id].group;
    if (id === 'condenser') g.quaternion.copy(axisQuat(new THREE.Vector3(1, -0.15, 0)));
    else g.quaternion.identity();
  }

  function placeOnBench(id, world) {
    touchView();
    var p = pieces[id];
    if (id !== 'receiver' && pieces.receiver.socket === 'under' && (id === 'adaptor' || id === 'condenser' || id === 'still' || id === 'flask')) {
      var rw = new THREE.Vector3();
      pieces.receiver.group.getWorldPosition(rw);
      scene.attach(pieces.receiver.group);
      pieces.receiver.group.position.set(Math.max(-5, Math.min(11, rw.x)), 0, Math.max(-4, Math.min(4, rw.z)));
      pieces.receiver.group.quaternion.identity();
      pieces.receiver.place = 'bench';
      pieces.receiver.socket = null;
    }
    scene.attach(p.group);
    p.group.position.set(
      Math.max(-5, Math.min(11, world.x)),
      REST_Y[id],
      Math.max(-4, Math.min(4, world.z))
    );
    orientFree(id);
    p.place = 'bench';
    p.socket = null;
    p.group.visible = true;
    if (id === 'condenser') p.slopeUp = false;
    if (id === 'adaptor') p.pointUp = false;
  }

  function attachFlask() {
    touchView();
    scene.attach(pieces.flask.group);
    pieces.flask.group.position.set(0, GAUZE_Y, 0);
    pieces.flask.group.quaternion.identity();
    pieces.flask.place = 'socket';
    pieces.flask.socket = 'stand';
    pieces.flask.group.visible = true;
    if (pieces.heat.socket === 'under') {
      pieces.flask.group.attach(pieces.heat.group);
      pieces.heat.group.position.set(0, -GAUZE_Y, 0);
      pieces.heat.group.quaternion.identity();
      pieces.heat.place = 'socket';
      pieces.heat.group.visible = true;
    }
  }

  function attachGranules() {
    touchView();
    pieces.flask.group.attach(pieces.granules.group);
    pieces.granules.group.position.set(0, 1.35, 0);
    pieces.granules.group.quaternion.identity();
    pieces.granules.place = 'socket';
    pieces.granules.socket = 'liquid';
    pieces.granules.group.visible = true;
  }

  function attachHeat() {
    touchView();
    pieces.flask.group.attach(pieces.heat.group);
    pieces.heat.group.position.set(0, -GAUZE_Y, 0);
    pieces.heat.group.quaternion.identity();
    pieces.heat.place = 'socket';
    pieces.heat.socket = 'under';
    pieces.heat.group.visible = true;
  }

  function attachStill() {
    touchView();
    pieces.flask.group.attach(pieces.still.group);
    pieces.still.group.position.set(0, NECK_Y, 0);
    pieces.still.group.quaternion.identity();
    pieces.still.place = 'socket';
    pieces.still.socket = 'neck';
    pieces.still.group.visible = true;
  }

  function attachThermo(t) {
    touchView();
    if (t < 0) t = 0;
    if (t > 1) t = 1;
    pieces.still.group.attach(pieces.thermo.group);
    var y = THERM_TOP + t * (THERM_BOT - THERM_TOP);
    pieces.thermo.group.position.set(0, y, 0);
    pieces.thermo.group.quaternion.identity();
    pieces.thermo.place = 'socket';
    pieces.thermo.socket = 'slot';
    pieces.thermo.t = t;
    pieces.thermo.group.visible = true;
  }

  function attachCondenser(slopeUp) {
    touchView();
    var dir = slopeUp ? new THREE.Vector3(1, 0.28, 0) : sideDir.clone();
    var worldDir = dir.clone().normalize().applyQuaternion(pieces.still.group.getWorldQuaternion(new THREE.Quaternion()));
    pieces.still.group.attach(pieces.condenser.group);
    pieces.condenser.group.position.copy(sideEnd);
    setWorldQuat(pieces.condenser.group, axisQuat(worldDir));
    pieces.condenser.place = 'socket';
    pieces.condenser.socket = 'side';
    pieces.condenser.slopeUp = !!slopeUp;
    pieces.condenser.group.visible = true;
  }

  function attachHose(id, nozzle) {
    touchView();
    var g = pieces[id].group;
    pieces.condenser.group.attach(g);
    g.position.copy(nozzleLocal[nozzle]);
    g.quaternion.identity();
    if (nozzleLocal[nozzle].y < 0) g.rotation.z = Math.PI;
    pieces[id].place = 'socket';
    pieces[id].socket = nozzle;
    g.visible = true;
  }

  function attachAdaptor(pointUp) {
    touchView();
    if (pieces.receiver.socket === 'under' && pointUp) {
      var rw = new THREE.Vector3();
      pieces.receiver.group.getWorldPosition(rw);
      placeOnBench('receiver', rw);
    }
    pieces.condenser.group.attach(pieces.adaptor.group);
    pieces.adaptor.group.position.set(COND_LEN, 0, 0);
    pieces.adaptor.group.rotation.set(pointUp ? Math.PI : 0, 0, 0);
    pieces.adaptor.place = 'socket';
    pieces.adaptor.socket = 'end';
    pieces.adaptor.pointUp = !!pointUp;
    pieces.adaptor.group.visible = true;
  }

  function attachReceiver() {
    pieces.receiver.place = 'socket';
    pieces.receiver.socket = 'under';
    positionReceiver();
  }

  function worldOf(group, local) {
    group.updateMatrixWorld(true);
    return group.localToWorld(local.clone());
  }

  function rayDistTo(point) {
    var ray = raycaster.ray;
    var v = point.clone().sub(ray.origin);
    var t = v.dot(ray.direction);
    if (t < 0) t = 0;
    return ray.at(t, new THREE.Vector3()).distanceTo(point);
  }

  function screenYOf(world) {
    var v = world.clone().project(camera);
    var rect = canvas.getBoundingClientRect();
    return rect.top + (-v.y * 0.5 + 0.5) * rect.height;
  }

  function pointerAbove(world) {
    return drag && drag.clientY < screenYOf(world) - 18;
  }

  function slotFromRay() {
    var best = { d: 1e9, t: T_SIDE };
    var i;
    for (i = 0; i <= 16; i++) {
      var t = i / 16;
      var y = THERM_TOP + t * (THERM_BOT - THERM_TOP);
      var d = rayDistTo(worldOf(pieces.still.group, new THREE.Vector3(0, y, 0)));
      if (d < best.d) best = { d: d, t: t };
    }
    return best;
  }

  function nearestSocket(id) {
    if (mode !== 'distil') return modeNearest(id);
    var bestD = 1e9;
    var best = null;
    function keep(d, radius, fn) {
      if (d < radius && d < bestD) { bestD = d; best = fn; }
    }
    if (id === 'flask') {
      keep(rayDistTo(new THREE.Vector3(0, GAUZE_Y, 0)), 2.2, attachFlask);
    } else if (id === 'granules' && pieces.flask.place !== 'tray') {
      keep(rayDistTo(worldOf(pieces.flask.group, new THREE.Vector3(0, 1.1, 0))), 1.8, attachGranules);
    } else if (id === 'heat' && pieces.flask.socket === 'stand') {
      keep(rayDistTo(worldOf(pieces.flask.group, new THREE.Vector3(0, -0.2, 0))), 1.8, attachHeat);
    } else if (id === 'still' && pieces.flask.place !== 'tray') {
      keep(rayDistTo(worldOf(pieces.flask.group, new THREE.Vector3(0, NECK_Y, 0))), 1.8, attachStill);
    } else if (id === 'thermo' && pieces.still.place !== 'tray') {
      var slot = slotFromRay();
      keep(slot.d, 1.35, function () { attachThermo(slot.t); });
    } else if (id === 'condenser' && pieces.still.place !== 'tray') {
      var joint = worldOf(pieces.still.group, sideEnd);
      keep(rayDistTo(joint), 1.9, function () { attachCondenser(pointerAbove(joint)); });
    } else if ((id === 'win' || id === 'wout') && pieces.condenser.place !== 'tray') {
      var other = id === 'win' ? 'wout' : 'win';
      ['nozzleA', 'nozzleB'].forEach(function (name) {
        if (pieces[other].socket === name) return;
        var nozzle = worldOf(pieces.condenser.group, nozzleLocal[name]);
        keep(rayDistTo(nozzle), 1.45, function () { attachHose(id, name); });
      });
    } else if (id === 'adaptor' && pieces.condenser.place !== 'tray') {
      var end = worldOf(pieces.condenser.group, new THREE.Vector3(COND_LEN, 0, 0));
      keep(rayDistTo(end), 2, function () { attachAdaptor(pointerAbove(end)); });
    } else if (id === 'receiver' && pieces.adaptor.socket === 'end' && !pieces.adaptor.pointUp) {
      var mouth = adaptorMouthWorld();
      var aim = mouth.clone();
      aim.y -= 1.1;
      keep(Math.min(rayDistTo(mouth), rayDistTo(aim)), 2.1, attachReceiver);
    }
    return best;
  }

  function applyPreview(id, point) {
    if (mode !== 'distil') { modePreview(id, point); return; }
    touchView();
    scene.attach(pieces[id].group);
    pieces[id].group.position.copy(point);
    orientFree(id);
    pieces[id].place = 'drag';
    pieces[id].socket = null;
    pieces[id].group.visible = true;
  }

  function glow(id, hex) {
    pieces[id].group.traverse(function (o) {
      if (o.isMesh && o.userData.mark && o.material && o.material.emissive) o.material.emissive.setHex(hex);
    });
  }
  function clearGlow() {
    Object.keys(pieces).forEach(function (id) { glow(id, 0x000000); });
  }

  function firstGap() {
    if (pieces.flask.socket !== 'stand') return 'flask';
    if (pieces.still.socket !== 'neck') return 'still';
    if (pieces.condenser.socket !== 'side') return 'cond';
    if (pieces.condenser.slopeUp) return 'slope';
    if (pieces.adaptor.socket !== 'end') return 'adaptor';
    if (pieces.adaptor.pointUp) return 'point';
    if (pieces.receiver.socket !== 'under') return 'receiver';
    return null;
  }

  function thermoState() {
    if (pieces.thermo.socket !== 'slot') return 'missing';
    if (Math.abs(pieces.thermo.t - T_SIDE) <= T_BAND) return 'ok';
    return pieces.thermo.t > T_SIDE ? 'low' : 'high';
  }

  function waterState() {
    if (pieces.condenser.place === 'tray') return 'missing';
    if (!pieces.win.socket || !pieces.wout.socket) return 'missing';
    var lower = lowerNozzle();
    var upper = lower === 'nozzleA' ? 'nozzleB' : 'nozzleA';
    if (pieces.win.socket === lower && pieces.wout.socket === upper) return 'ok';
    return 'reverse';
  }

  function granulesIn() { return pieces.granules.socket === 'liquid'; }
  function heatUnder() { return pieces.heat.socket === 'under' && pieces.flask.socket === 'stand'; }

  function allCorrect() {
    return !firstGap() && thermoState() === 'ok' && waterState() === 'ok' && granulesIn() && heatUnder();
  }

  function markHtml(i) {
    if (i === 0) {
      var gap = firstGap();
      if (!gap) return 'Vapour passes from the flask through the still head and condenser to the <span class="hl-joint">receiver</span>.';
      if (gap === 'flask') return 'The <span class="hl-bad">flask</span> is not on the stand.';
      if (gap === 'still') return 'The <span class="hl-bad">still head</span> is not on the flask.';
      if (gap === 'cond') return 'The <span class="hl-bad">condenser</span> is not joined to the still head.';
      if (gap === 'slope') return 'The condenser <span class="hl-bad">slopes upwards</span>.';
      if (gap === 'adaptor') return 'The <span class="hl-bad">receiver adaptor</span> is not on the condenser.';
      if (gap === 'point') return 'The receiver adaptor <span class="hl-bad">does not point down</span>.';
      return 'The <span class="hl-bad">receiver</span> is not under the adaptor.';
    }
    if (i === 1) {
      var th = thermoState();
      if (th === 'ok') return 'The thermometer bulb is <span class="hl-pos">level with the side arm</span>.';
      if (th === 'low') return 'The thermometer bulb is <span class="hl-bad">too low</span>.';
      if (th === 'high') return 'The thermometer bulb is <span class="hl-bad">too high</span>.';
      return 'The <span class="hl-bad">thermometer</span> is not in the still head.';
    }
    if (i === 2) {
      var w = waterState();
      if (w === 'ok') return 'Water enters at the <span class="hl-water">lower end</span> and leaves at the <span class="hl-water">upper end</span>.';
      if (w === 'reverse') return 'Water enters at the <span class="hl-bad">upper end</span>.';
      return 'Water in and water out are <span class="hl-bad">not both connected</span>.';
    }
    if (i === 3) {
      if (granulesIn()) return 'Anti-bumping granules <span class="hl-gran">in the flask</span> prevent bumping.';
      return 'Anti-bumping granules are <span class="hl-bad">not in the flask</span>.';
    }
    if (heatUnder()) return 'Heat is <span class="hl-heat">under the flask</span>.';
    return 'Heat is <span class="hl-bad">not under the flask</span>.';
  }

  function verdictHtml() {
    if (allCorrect()) return 'The quick-fit fractional distillation apparatus is <span class="hl-gran">correctly set up</span>.';
    return 'The quick-fit fractional distillation apparatus is <span class="hl-bad">not yet correct</span>.';
  }

  function paint() {
    clearGlow();
    if (step < 0 || step > 4) return;
    if (step === 0) {
      var chain = [
        ['flask', pieces.flask.socket === 'stand'],
        ['still', pieces.still.socket === 'neck'],
        ['condenser', pieces.condenser.socket === 'side' && !pieces.condenser.slopeUp],
        ['adaptor', pieces.adaptor.socket === 'end' && !pieces.adaptor.pointUp],
        ['receiver', pieces.receiver.socket === 'under']
      ];
      var failed = false;
      chain.forEach(function (row) {
        if (failed) return;
        if (row[1]) glow(row[0], OK);
        else { glow(row[0], BAD); failed = true; }
      });
    } else if (step === 1) {
      glow('thermo', thermoState() === 'ok' ? OK : BAD);
      glow('still', thermoState() === 'ok' ? OK : BAD);
    } else if (step === 2) {
      var good = waterState() === 'ok';
      glow('condenser', good ? OK : BAD);
      glow('win', good ? OK : BAD);
      glow('wout', good ? OK : BAD);
    } else if (step === 3) {
      glow('granules', granulesIn() ? OK : BAD);
      glow('flask', granulesIn() ? OK : BAD);
    } else if (step === 4) {
      glow('heat', heatUnder() ? OK : BAD);
      glow('flask', heatUnder() ? OK : BAD);
    }
  }

  function fitAnswer() {
    answerInner.style.transform = 'none';
    var room = answer.clientWidth - 8;
    if (room <= 0 || !answerInner.scrollWidth) return;
    var scale = Math.min(1, room / answerInner.scrollWidth);
    if (scale < 0.99) answerInner.style.transform = 'scale(' + scale + ')';
  }

  function updateChips() {
    if (mode !== 'distil') { modeUpdateChips(); return; }
    Object.keys(pieces).forEach(function (id) {
      var on = pieces[id].place !== 'tray';
      pieces[id].chip.classList.toggle('on', on);
      pieces[id].chip.classList.toggle('hot', drag && drag.id === id && drag.active);
      pieces[id].chip.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }

  function showStep() {
    if (mode !== 'distil') { modeShowStep(); return; }
    checkBtn.setAttribute('aria-pressed', step >= 0 ? 'true' : 'false');
    if (step < 0) {
      stageName.textContent = 'Join the quick-fit apparatus.';
      answer.setAttribute('aria-hidden', 'true');
      answerInner.innerHTML = '';
      stepLabel.textContent = 'Build';
      backBtn.disabled = true;
      nextBtn.disabled = true;
    } else if (step < 5) {
      stageName.innerHTML = markHtml(step);
      answer.setAttribute('aria-hidden', 'true');
      answerInner.innerHTML = '';
      stepLabel.textContent = (step + 1) + ' / 6';
      backBtn.disabled = false;
      nextBtn.disabled = false;
    } else {
      var verdict = verdictHtml();
      stageName.innerHTML = verdict;
      answerInner.innerHTML = verdict;
      answer.setAttribute('aria-hidden', 'false');
      stepLabel.textContent = '6 / 6';
      backBtn.disabled = false;
      nextBtn.disabled = true;
    }
    paint();
    updateChips();
    fitAnswer();
    requestRender();
    sketchSync();
  }

  function leaveCheck() {
    if (step < 0) return;
    step = -1;
    showStep();
  }

  function labelAnchor(id) {
    labelLocal.set(0, 0.7, 0);
    if (id === 'thermo') labelLocal.set(0.85, 3.7, 0.2);
    else if (id === 'flask') labelLocal.set(-1.6, 1.2, 1.7);
    else if (id === 'granules') labelLocal.set(-0.2, 0.5, 2);
    else if (id === 'heat') labelLocal.set(0.5, 0.15, 1.9);
    else if (id === 'win' || id === 'wout') labelLocal.set(0, 0.45, 2.05);
    else if (id === 'condenser') labelLocal.set(COND_LEN * 0.5, 1.05, 0.2);
    else if (id === 'still') labelLocal.set(-1.15, 2.6, 0.5);
    else if (id === 'adaptor') labelLocal.set(1.6, -0.6, 0.8);
    else if (id === 'receiver') labelLocal.set(1.2, 1.1, 0.4);
    pieces[id].group.updateMatrixWorld(true);
    return pieces[id].group.localToWorld(labelLocal);
  }

  function updateLabels() {
    if (mode !== 'distil') { modeUpdateLabels(); return; }
    var w = view.clientWidth;
    var h = view.clientHeight;
    var items = [];
    Object.keys(pieces).forEach(function (id) {
      var p = pieces[id];
      if (p.place === 'tray' || !p.group.visible) {
        p.labelEl.style.display = 'none';
        return;
      }
      var pos = labelAnchor(id);
      pos.project(camera);
      if (pos.z > 1) {
        p.labelEl.style.display = 'none';
        return;
      }
      items.push({
        el: p.labelEl,
        x: (pos.x * 0.5 + 0.5) * w,
        y: (-pos.y * 0.5 + 0.5) * h
      });
    });
    items.sort(function (a, b) { return a.y - b.y || a.x - b.x; });
    for (var i = 1; i < items.length; i++) {
      if (Math.abs(items[i].x - items[i - 1].x) < 72 && items[i].y - items[i - 1].y < 18) {
        items[i].y = items[i - 1].y + 18;
      }
    }
    items.forEach(function (it) {
      var x = Math.max(44, Math.min(w - 44, it.x));
      var y = Math.max(26, Math.min(h - 8, it.y));
      it.el.style.display = 'block';
      it.el.style.transform = 'translate(' + x + 'px,' + y + 'px) translate(-50%, -100%)';
    });
  }

  function showProc(on) {
    var i;
    for (i = 0; i < BUBBLES.length; i++) BUBBLES[i].visible = on;
    for (i = 0; i < VAPOUR.length; i++) VAPOUR[i].mesh.visible = on;
    for (i = 0; i < DROPS.length; i++) DROPS[i].visible = on;
    for (i = 0; i < JACKET.length; i++) JACKET[i].visible = on;
    if (distillate) distillate.visible = on;
  }

  function stepProcess(on, dt) {
    var i;
    var n;
    var u;
    if (!on) {
      if (!procShown) return;
      procT = 0;
      procShown = false;
      showProc(false);
      if (flameMesh) flameMesh.scale.set(1, 1, 1);
      if (distillate) distillate.scale.y = 0.12;
      return;
    }
    procT += dt;
    if (!procShown) {
      procShown = true;
      showProc(true);
    }
    n = BUBBLES.length;
    for (i = 0; i < n; i++) {
      u = (procT * 0.28 + i / n) % 1;
      var bub = BUBBLES[i];
      var bang = bub.userData.ang;
      var brad = bub.userData.rad;
      var rise = filtEase(u);
      var spread = 0.55 + 0.45 * (1 - rise);
      bub.position.set(Math.cos(bang) * brad * spread, 0.4 + rise * 1.65, Math.sin(bang) * brad * spread);
    }
    n = VAPOUR.length;
    for (i = 0; i < n; i++) {
      u = (procT * 0.22 + i / n) % 1;
      VAPOUR[i].mesh.position.lerpVectors(VAPOUR[i].a, VAPOUR[i].b, filtEase(u));
    }
    n = DROPS.length;
    for (i = 0; i < n; i++) {
      u = (procT * 0.16 + i / n) % 1;
      DROPS[i].position.set(0.4 + u * (COND_LEN - 0.7), 0, 0);
    }
    var lowerName = lowerNozzle();
    var upperName = lowerName === 'nozzleA' ? 'nozzleB' : 'nozzleA';
    var x0 = nozzleLocal[lowerName].x;
    var x1 = nozzleLocal[upperName].x;
    n = JACKET.length;
    for (i = 0; i < n; i++) {
      u = (procT * 0.2 + i / n) % 1;
      var rad = JACKET[i].userData.rad;
      var ang = JACKET[i].userData.ang + u * Math.PI * 4;
      JACKET[i].position.set(x0 + (x1 - x0) * u, Math.sin(ang) * rad, Math.cos(ang) * rad);
      JACKET[i].material.color.copy(COLD_WATER).lerp(WARM_WATER, u);
    }
    u = Math.min(1, procT / 4);
    distillate.scale.y = Math.max(0.12, u * u * (3 - 2 * u));
    if (flameMesh) {
      var flick = 0.94 + 0.06 * Math.sin(procT * 7);
      flameMesh.scale.set(0.96 + 0.04 * Math.sin(procT * 5), flick, 0.96 + 0.04 * Math.cos(procT * 6));
    }
  }

  function draw(now) {
    if (view2d) { sketchDraw(now); return; }
    if (mode !== 'distil') { modeDraw(now); return; }
    pending = false;
    if (rigMoved && pieces.receiver.socket === 'under') {
      if (pieces.adaptor.socket === 'end' && !pieces.adaptor.pointUp) positionReceiver();
      else {
        var rw = new THREE.Vector3();
        pieces.receiver.group.getWorldPosition(rw);
        pieces.receiver.socket = null;
        placeOnBench('receiver', rw);
      }
    }
    rigMoved = false;
    var t = typeof now === 'number' ? now : performance.now();
    var dt = lastDrawAt ? Math.min(0.05, (t - lastDrawAt) / 1000) : 0.016;
    lastDrawAt = t;
    if (runningCached === null) runningCached = allCorrect();
    var running = runningCached;
    stepProcess(running, dt);
    renderer.render(scene, camera);
    if (labelsDirty) {
      updateLabels();
      labelsDirty = false;
    }
    if (running) requestRender();
  }

  function resize() {
    var w = view.clientWidth;
    var h = view.clientHeight;
    if (!w || !h) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    if (w === viewW && h === viewH && dpr === viewDpr) return;
    viewW = w;
    viewH = h;
    viewDpr = dpr;
    renderer.setPixelRatio(dpr);
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    labelsDirty = true;
    requestRender();
  }

  function setPointer(e) {
    var rect = canvas.getBoundingClientRect();
    pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  }

  var dragDir = new THREE.Vector3();
  var dragPlane = new THREE.Plane();
  var dragHit = new THREE.Vector3();

  function planeThrough(point) {
    camera.getWorldDirection(dragDir);
    return dragPlane.setFromNormalAndCoplanarPoint(dragDir, point);
  }

  function hitPlane(plane) {
    if (!raycaster.ray.intersectPlane(plane, dragHit)) return null;
    return dragHit;
  }

  function pickPiece() {
    if (mode !== 'distil') return modePick();
    raycaster.setFromCamera(pointer, camera);
    var meshes = [];
    Object.keys(pieces).forEach(function (id) {
      if (pieces[id].place === 'tray') return;
      pieces[id].group.traverse(function (o) {
        if (o.isMesh && o.name.indexOf('proc-') !== 0) meshes.push(o);
      });
    });
    var hits = raycaster.intersectObjects(meshes, false);
    if (!hits.length) return null;
    return hits[0].object.userData.pieceId;
  }

  function startActiveDrag(e) {
    if (mode !== 'distil') { modeStartDrag(e); return; }
    var id = drag.id;
    var p = pieces[id];
    if (id === 'flask' && pieces.heat.socket === 'under') {
      scene.attach(pieces.heat.group);
      pieces.heat.group.position.set(0, 0, 0);
      pieces.heat.group.quaternion.identity();
    }
    setPointer(e);
    raycaster.setFromCamera(pointer, camera);
    var grabbed = null;
    if (!drag.fromTray) {
      var meshes = [];
      p.group.updateMatrixWorld(true);
      p.group.traverse(function (o) {
        if (o.isMesh && o.name.indexOf('proc-') !== 0) meshes.push(o);
      });
      var hits = raycaster.intersectObjects(meshes, false);
      if (hits.length) grabbed = hits[0].point.clone();
    }
    if (p.group.parent !== scene) scene.attach(p.group);
    var world = new THREE.Vector3();
    p.group.getWorldPosition(world);
    var anchor = grabbed || world;
    if (drag.fromTray) {
      p.group.visible = true;
      p.group.quaternion.identity();
      anchor = target.clone();
    }
    var plane = planeThrough(anchor);
    var hit = hitPlane(plane) || anchor.clone();
    if (drag.fromTray) {
      p.group.position.copy(hit);
      world.copy(hit);
    }
    drag.plane = plane;
    drag.offset = world.clone().sub(hit);
    drag.active = true;
    p.place = 'drag';
    p.socket = null;
    touchView();
    leaveCheck();
    updateChips();
    requestRender();
  }

  function moveDrag(e) {
    drag.clientY = e.clientY;
    setPointer(e);
    raycaster.setFromCamera(pointer, camera);
    var hit = hitPlane(drag.plane);
    if (!hit) return;
    applyPreview(drag.id, hit.add(drag.offset));
    requestRender();
  }

  function finishDrag(id) {
    if (mode !== 'distil') { modeFinish(id); return; }
    var snap = nearestSocket(id);
    if (snap) snap();
    var p = pieces[id];
    if (p.place !== 'socket') {
      var w = new THREE.Vector3();
      p.group.getWorldPosition(w);
      placeOnBench(id, w);
    } else if (id === 'flask') {
      attachFlask();
    }
    if (pieces.heat.socket === 'under' && pieces.flask.socket !== 'stand') {
      var hw = new THREE.Vector3();
      pieces.heat.group.getWorldPosition(hw);
      hw.z += 1.6;
      placeOnBench('heat', hw);
    }
    updateChips();
    requestRender();
  }

  function toTray(id) {
    if (mode !== 'distil') { modeToTray(id); return; }
    touchView();
    (CHILD_OF[id] || []).forEach(function (cid) {
      if (pieces[cid].place === 'socket' || pieces[cid].place === 'bench' && pieces[cid].group.parent === pieces[id].group) {
        var w = new THREE.Vector3();
        pieces[cid].group.getWorldPosition(w);
        placeOnBench(cid, w);
      }
    });
    (CHILD_OF[id] || []).forEach(function (cid) {
      if (pieces[cid].group.parent === pieces[id].group) {
        var w2 = new THREE.Vector3();
        pieces[cid].group.getWorldPosition(w2);
        placeOnBench(cid, w2);
      }
    });
    var p = pieces[id];
    scene.attach(p.group);
    p.group.visible = false;
    p.place = 'tray';
    p.socket = null;
    leaveCheck();
    updateChips();
    requestRender();
  }

  function releaseCam(pointerId) {
    if (panPtr && String(panPtr.id) === String(pointerId)) panPtr = null;
    if (!camPts[pointerId]) return;
    delete camPts[pointerId];
    if (orbitPtr && String(orbitPtr.id) === String(pointerId)) orbitPtr = null;
    var leftId = null;
    var k;
    var n = 0;
    for (k in camPts) {
      n += 1;
      leftId = k;
    }
    if (n === 1) {
      orbitPtr = { id: leftId, x: camPts[leftId].x, y: camPts[leftId].y };
      pinchPrev = null;
    } else if (n >= 2) {
      armPinch();
    } else {
      pinchPrev = null;
    }
  }

  function armPinch() {
    pinchPrev = pinchMeasure();
    if (pinchPrev) pinchPrev.radius = radius;
  }

  tray.addEventListener('pointerdown', function (e) {
    var chip = e.target.closest('.chip');
    if (!chip || penOn || laserOn) return;
    if (view2d) { sketchFromTray(e, chip); return; }
    e.preventDefault();
    drag = {
      id: chip.dataset.id,
      pointerId: e.pointerId,
      sx: e.clientX,
      sy: e.clientY,
      active: false,
      fromTray: (mode === 'distil' ? pieces[chip.dataset.id] : modePieces[chip.dataset.id]).place === 'tray',
      before: mode === 'distil' ? rigSnapshot() : modeSnapshot()
    };
  });

  canvas.addEventListener('pointerdown', function (e) {
    if (penOn || laserOn || drag) return;
    if (e.button === 2) {
      e.preventDefault();
      panPtr = { id: e.pointerId, x: e.clientX, y: e.clientY };
      return;
    }
    if (e.button !== 0) return;
    setPointer(e);
    if (camCount() === 0) {
      var id = pickPiece();
      if (id) {
        e.preventDefault();
        drag = {
          id: id,
          pointerId: e.pointerId,
          sx: e.clientX,
          sy: e.clientY,
          active: false,
          fromTray: false,
          before: rigSnapshot()
        };
        return;
      }
    }
    e.preventDefault();
    camPts[e.pointerId] = { x: e.clientX, y: e.clientY };
    if (camCount() === 1) {
      orbitPtr = { id: e.pointerId, x: e.clientX, y: e.clientY };
      pinchPrev = null;
    } else {
      orbitPtr = null;
      armPinch();
    }
  });

  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  canvas.addEventListener('wheel', function (e) {
    if (penOn || laserOn) return;
    e.preventDefault();
    var dy = e.deltaY;
    if (e.deltaMode === 1) dy *= 16;
    if (e.deltaMode === 2) dy *= 120;
    radius = clampRadius(radius * Math.exp(dy * 0.0011));
    applyCamera();
    requestRender();
  }, { passive: false });

  window.addEventListener('pointermove', function (e) {
    if (sketchDrag && e.pointerId === sketchDrag.pointerId) { sketchMove(e); return; }
    if (panPtr && e.pointerId === panPtr.id) {
      panBy(e.clientX - panPtr.x, e.clientY - panPtr.y);
      panPtr.x = e.clientX;
      panPtr.y = e.clientY;
      applyCamera();
      requestRender();
      return;
    }
    if (camPts[e.pointerId]) {
      camPts[e.pointerId].x = e.clientX;
      camPts[e.pointerId].y = e.clientY;
      if (camCount() >= 2) {
        var now = pinchMeasure();
        if (pinchPrev && now) {
          radius = clampRadius(pinchPrev.radius * (pinchPrev.dist / now.dist));
          panBy(now.mx - pinchPrev.mx, now.my - pinchPrev.my);
          pinchPrev.dist = now.dist;
          pinchPrev.mx = now.mx;
          pinchPrev.my = now.my;
          pinchPrev.radius = radius;
        }
        applyCamera();
        requestRender();
        return;
      }
      if (orbitPtr && String(orbitPtr.id) === String(e.pointerId)) {
        azimuth += (e.clientX - orbitPtr.x) * 0.008;
        azimuth = Math.atan2(Math.sin(azimuth), Math.cos(azimuth));
        polar = clampPolar(polar + (e.clientY - orbitPtr.y) * 0.008);
        orbitPtr.x = e.clientX;
        orbitPtr.y = e.clientY;
        applyCamera();
        requestRender();
      }
      return;
    }
    if (!drag || e.pointerId !== drag.pointerId) return;
    if (!drag.active) {
      var dx = e.clientX - drag.sx;
      var dy = e.clientY - drag.sy;
      if (dx * dx + dy * dy < 36) return;
      startActiveDrag(e);
    }
    moveDrag(e);
  });

  window.addEventListener('pointerup', endPointer);
  window.addEventListener('pointercancel', endPointer);
  function endPointer(e) {
    if (sketchDrag && e.pointerId === sketchDrag.pointerId) { sketchUp(e); return; }
    releaseCam(e.pointerId);
    if (!drag || e.pointerId !== drag.pointerId) return;
    var d = drag;
    drag = null;
    if (!d.active) {
      if (!d.fromTray) {
        toTray(d.id);
        pushUndo({ kind: mode === 'distil' ? 'rig' : 'mode-rig', snap: d.before });
      }
      updateChips();
      return;
    }
    setPointer(e);
    raycaster.setFromCamera(pointer, camera);
    finishDrag(d.id);
    pushUndo({ kind: mode === 'distil' ? 'rig' : 'mode-rig', snap: d.before });
  }

  function pieceParentId(id) {
    var parent = pieces[id].group.parent;
    var keys;
    var i;
    if (!parent || parent === scene) return null;
    keys = Object.keys(pieces);
    for (i = 0; i < keys.length; i++) {
      if (pieces[keys[i]].group === parent) return keys[i];
    }
    return null;
  }

  function rigSnapshot() {
    return Object.keys(pieces).map(function (id) {
      var p = pieces[id];
      return {
        id: id,
        parentId: pieceParentId(id),
        position: p.group.position.clone(),
        quaternion: p.group.quaternion.clone(),
        visible: p.group.visible,
        place: p.place,
        socket: p.socket,
        t: p.t,
        slopeUp: p.slopeUp,
        pointUp: p.pointUp
      };
    });
  }

  function restoreRig(snap) {
    snap.forEach(function (row) {
      var p = pieces[row.id];
      var parent = row.parentId ? pieces[row.parentId].group : scene;
      parent.attach(p.group);
      p.group.position.copy(row.position);
      p.group.quaternion.copy(row.quaternion);
      p.group.visible = row.visible;
      p.place = row.place;
      p.socket = row.socket;
      p.t = row.t;
      p.slopeUp = row.slopeUp;
      p.pointUp = row.pointUp;
    });
    lastMouth.set(NaN, NaN, NaN);
    touchView();
    updateChips();
    requestRender();
  }

  function pushUndo(action) {
    undoStack.push(action);
    if (undoStack.length > 40) undoStack.shift();
  }

  function setCorrect() {
    attachFlask();
    attachGranules();
    attachHeat();
    attachStill();
    attachThermo(T_SIDE);
    attachCondenser(false);
    attachHose('wout', 'nozzleA');
    attachHose('win', 'nozzleB');
    attachAdaptor(false);
    attachReceiver();
    step = -1;
    showStep();
  }

  function setWrong() {
    setCorrect();
    attachThermo(0.92);
    attachHose('win', 'nozzleA');
    attachHose('wout', 'nozzleB');
    step = -1;
    showStep();
  }

  function screenOf(world) {
    var v = world.clone().project(camera);
    var rect = canvas.getBoundingClientRect();
    return {
      x: rect.left + (v.x * 0.5 + 0.5) * rect.width,
      y: rect.top + (-v.y * 0.5 + 0.5) * rect.height
    };
  }

  function dragPiece(id, world, dy) {
    var chip = pieces[id].chip;
    var r = chip.getBoundingClientRect();
    var s = screenOf(world);
    var pid = 7;
    chip.dispatchEvent(new PointerEvent('pointerdown', {
      bubbles: true, cancelable: true, clientX: r.x + 8, clientY: r.y + 10, pointerId: pid, pointerType: 'mouse'
    }));
    window.dispatchEvent(new PointerEvent('pointermove', {
      bubbles: true, cancelable: true, clientX: s.x, clientY: s.y + (dy || 0), pointerId: pid, pointerType: 'mouse'
    }));
    window.dispatchEvent(new PointerEvent('pointerup', {
      bubbles: true, cancelable: true, clientX: s.x, clientY: s.y + (dy || 0), pointerId: pid, pointerType: 'mouse'
    }));
  }

  window.__lab = {
    correct: setCorrect,
    wrong: setWrong,
    mark: function () { return stageName.innerHTML; },
    answer: function () { return answerInner.innerHTML; },
    go: function (n) { step = n; showStep(); },
    gap: firstGap,
    thermo: thermoState,
    water: waterState,
    all: allCorrect,
    pieces: pieces,
    cam: function () {
      return {
        azimuth: azimuth,
        polar: polar,
        radius: radius,
        x: target.x,
        y: target.y,
        z: target.z
      };
    },
    proc: function () {
      return {
        t: procT,
        bubble: BUBBLES[0] ? BUBBLES[0].visible : false,
        vapour: VAPOUR[0] ? VAPOUR[0].mesh.visible : false,
        drop: DROPS[0] ? DROPS[0].visible : false,
        flow: JACKET[0] ? JACKET[0].visible : false,
        level: distillate ? distillate.scale.y : 0,
        bubbleY: BUBBLES[0] ? BUBBLES[0].position.y : 0,
        vapourY: VAPOUR[0] ? VAPOUR[0].mesh.position.y : 0,
        dropX: DROPS[0] ? DROPS[0].position.x : 0,
        flowX: JACKET[0] ? JACKET[0].position.x : 0
      };
    },
    dragAll: function () {
      dragPiece('flask', new THREE.Vector3(0, GAUZE_Y, 0));
      dragPiece('granules', worldOf(pieces.flask.group, new THREE.Vector3(0, 1.1, 0)));
      dragPiece('heat', worldOf(pieces.flask.group, new THREE.Vector3(0, -0.2, 0)));
      dragPiece('still', worldOf(pieces.flask.group, new THREE.Vector3(0, NECK_Y, 0)));
      dragPiece('thermo', worldOf(pieces.still.group, new THREE.Vector3(0, SIDE_Y, 0)));
      dragPiece('condenser', worldOf(pieces.still.group, sideEnd));
      dragPiece('wout', worldOf(pieces.condenser.group, nozzleLocal.nozzleA));
      dragPiece('win', worldOf(pieces.condenser.group, nozzleLocal.nozzleB));
      dragPiece('adaptor', worldOf(pieces.condenser.group, new THREE.Vector3(COND_LEN, 0, 0)));
      var mouth = adaptorMouthWorld();
      dragPiece('receiver', mouth);
      return {
        all: allCorrect(),
        gap: firstGap(),
        thermo: thermoState(),
        water: waterState(),
        sockets: Object.keys(pieces).map(function (id) {
          return id + ':' + pieces[id].socket + (id === 'thermo' ? '@' + pieces[id].t.toFixed(2) : '');
        }).join(' ')
      };
    }
  };

  backBtn.addEventListener('click', function () {
    if (step === 0) step = -1;
    else if (step > 0) step -= 1;
    showStep();
  });
  nextBtn.addEventListener('click', function () {
    var cap = mode === 'distil' ? 5 : modeContentSteps();
    if (step >= 0 && step < cap) {
      step += 1;
      showStep();
    }
  });
  checkBtn.addEventListener('click', function () {
    step = 0;
    showStep();
  });
  hideBtn.addEventListener('click', function () { setDesc(descHidden); });
  zoomBtn.addEventListener('click', function () {
    zoomed = !zoomed;
    document.body.classList.toggle('zoomed', zoomed);
    zoomBtn.setAttribute('aria-pressed', zoomed ? 'true' : 'false');
    placeZoom();
    requestAnimationFrame(function () {
      fitZoom();
      resize();
      fitAnswer();
    });
  });

  function setDesc(show) {
    descHidden = !show;
    desc.classList.toggle('hidden', descHidden);
    hideBtn.textContent = descHidden ? 'Show' : 'Hide';
    hideBtn.setAttribute('aria-pressed', descHidden ? 'true' : 'false');
  }
  function placeZoom() {
    if (!zoomed) {
      stage.style.top = '';
      stage.style.left = '';
      stage.style.right = '';
      stage.style.bottom = '';
      return;
    }
    stage.style.top = document.querySelector('.topbar').offsetHeight + 'px';
    stage.style.left = '8px';
    stage.style.right = '72px';
    stage.style.bottom = '8px';
  }
  function fitZoom() {
    zoomFit.style.transform = '';
    if (!zoomed) return;
    var haveH = zoomFit.clientHeight;
    var needH = zoomFit.scrollHeight;
    var haveW = zoomFit.clientWidth;
    var needW = zoomFit.scrollWidth;
    if (!needH || !needW) return;
    var scale = Math.min(1, haveH / needH, haveW / needW);
    if (scale < 0.99) {
      zoomFit.style.transformOrigin = 'top center';
      zoomFit.style.transform = 'scale(' + scale + ')';
    }
  }

  function resizeCanvas(c) {
    var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    var cssW = window.innerWidth;
    var cssH = window.innerHeight;
    var w = Math.round(cssW * dpr);
    var h = Math.round(cssH * dpr);
    c.style.width = cssW + 'px';
    c.style.height = cssH + 'px';
    if (c.width === w && c.height === h) return;
    c.width = w;
    c.height = h;
    c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function wipe(c) {
    var ctx = c.getContext('2d');
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.restore();
  }
  function setPen(on) {
    if (on) {
      laserOn = false;
      document.body.classList.remove('laser-on');
      document.getElementById('dkLaser').classList.remove('active');
      laserDot.classList.add('hidden');
    }
    penOn = on;
    document.body.classList.toggle('pen-on', on);
    document.getElementById('dkPen').classList.toggle('active', on);
    document.getElementById('dkColors').classList.toggle('hidden', !on);
    if (!on) {
      erasing = false;
      document.getElementById('dkErase').classList.remove('active');
    }
  }
  function setLaser(on) {
    if (on) setPen(false);
    laserOn = on;
    document.body.classList.toggle('laser-on', on);
    document.getElementById('dkLaser').classList.toggle('active', on);
    if (!on) laserDot.classList.add('hidden');
    else if (hasPointer) laserDot.classList.remove('hidden');
    if (on && !laserRunning) {
      laserRunning = true;
      lastFrame = 0;
      requestAnimationFrame(laserFrame);
    }
  }
  document.getElementById('dkPen').addEventListener('click', function () { setPen(!penOn); });
  document.getElementById('dkLaser').addEventListener('click', function () { setLaser(!laserOn); });
  document.getElementById('dkErase').addEventListener('click', function () {
    erasing = !erasing;
    document.getElementById('dkErase').classList.toggle('active', erasing);
  });
  document.getElementById('dkColors').addEventListener('click', function (e) {
    var btn = e.target.closest('.dcolor');
    if (!btn) return;
    ink = btn.dataset.c;
    erasing = false;
    document.getElementById('dkErase').classList.remove('active');
    document.querySelectorAll('.dcolor').forEach(function (el) {
      el.classList.toggle('active', el === btn);
    });
  });
  document.getElementById('dkClear').addEventListener('click', function () {
    if (inkStrokes.length) pushUndo({ kind: 'clear', strokes: inkStrokes });
    inkStrokes = [];
    openStroke = null;
    wipe(penCanvas);
    wipe(laserCanvas);
  });
  function paintSeg(erase, color, a, b) {
    penCtx.lineCap = 'round';
    penCtx.lineJoin = 'round';
    if (erase) {
      penCtx.globalCompositeOperation = 'destination-out';
      penCtx.strokeStyle = 'rgba(0,0,0,1)';
      penCtx.lineWidth = 26;
    } else {
      penCtx.globalCompositeOperation = 'source-over';
      penCtx.strokeStyle = color;
      penCtx.lineWidth = 3.6;
    }
    penCtx.beginPath();
    penCtx.moveTo(a.x, a.y);
    penCtx.lineTo(b.x, b.y);
    penCtx.stroke();
  }
  function stroke(a, b) {
    paintSeg(erasing, ink, a, b);
  }
  function redrawInk() {
    var s;
    var i;
    wipe(penCanvas);
    for (s = 0; s < inkStrokes.length; s++) {
      var strokeObj = inkStrokes[s];
      if (strokeObj.pts.length === 1) paintSeg(strokeObj.erase, strokeObj.color, strokeObj.pts[0], strokeObj.pts[0]);
      for (i = 1; i < strokeObj.pts.length; i++) {
        paintSeg(strokeObj.erase, strokeObj.color, strokeObj.pts[i - 1], strokeObj.pts[i]);
      }
    }
  }
  penCanvas.addEventListener('pointerdown', function (e) {
    if (!penOn) return;
    try { penCanvas.setPointerCapture(e.pointerId); } catch (err) {}
    drawing = true;
    lastPt = { x: e.clientX, y: e.clientY };
    openStroke = { erase: erasing, color: ink, pts: [lastPt] };
    inkStrokes.push(openStroke);
    stroke(lastPt, lastPt);
  });
  penCanvas.addEventListener('pointermove', function (e) {
    if (!drawing) return;
    var p = { x: e.clientX, y: e.clientY };
    if (openStroke) openStroke.pts.push(p);
    stroke(lastPt, p);
    lastPt = p;
  });
  function endDraw() {
    if (!drawing) return;
    drawing = false;
    openStroke = null;
    pushUndo({ kind: 'ink' });
  }
  penCanvas.addEventListener('pointerup', endDraw);
  penCanvas.addEventListener('pointercancel', endDraw);
  document.addEventListener('pointermove', function (e) {
    laserX = e.clientX;
    laserY = e.clientY;
    hasPointer = true;
    if (!laserOn) return;
    laserDot.style.left = laserX + 'px';
    laserDot.style.top = laserY + 'px';
    laserDot.classList.remove('hidden');
  });
  document.addEventListener('pointerleave', function () {
    hasPointer = false;
    laserDot.classList.add('hidden');
  });
  function laserFrame(now) {
    if (!laserOn) {
      laserRunning = false;
      wipe(laserCanvas);
      return;
    }
    var dt = lastFrame ? Math.min(40, now - lastFrame) : 16;
    lastFrame = now;
    laserCtx.save();
    laserCtx.setTransform(1, 0, 0, 1, 0, 0);
    laserCtx.globalCompositeOperation = 'destination-out';
    laserCtx.fillStyle = 'rgba(0,0,0,' + (dt / 1600) + ')';
    laserCtx.fillRect(0, 0, laserCanvas.width, laserCanvas.height);
    laserCtx.restore();
    if (laserOn && hasPointer) {
      laserCtx.globalCompositeOperation = 'source-over';
      laserCtx.fillStyle = 'rgba(255,40,40,0.7)';
      laserCtx.beginPath();
      laserCtx.arc(laserX, laserY, 5, 0, Math.PI * 2);
      laserCtx.fill();
    }
    requestAnimationFrame(laserFrame);
  }
  function undoLast() {
    var action;
    if (drag || drawing) return;
    action = undoStack.pop();
    if (!action) return;
    if (action.kind === 'ink') {
      inkStrokes.pop();
      redrawInk();
    } else if (action.kind === 'clear') {
      inkStrokes = action.strokes;
      redrawInk();
    } else if (action.kind === 'mode-rig') {
      restoreModeRig(action.snap);
    } else if (action.kind === 'rig') {
      restoreRig(action.snap);
    }
  }
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { setPen(false); setLaser(false); }
    if ((e.ctrlKey || e.metaKey) && !e.altKey && !e.shiftKey && (e.key === 'z' || e.key === 'Z')) {
      e.preventDefault();
      undoLast();
    }
  });

  window.addEventListener('resize', function () {
    resizeCanvas(penCanvas);
    resizeCanvas(laserCanvas);
    redrawInk();
    placeZoom();
    fitZoom();
    resize();
    fitAnswer();
  });
  if (window.ResizeObserver) {
    new ResizeObserver(function () {
      resize();
      fitAnswer();
    }).observe(view);
  }

  setDesc(!window.matchMedia('(max-width: 800px)').matches);
  resizeCanvas(penCanvas);
  resizeCanvas(laserCanvas);
  applyCamera();
  showStep();
  requestAnimationFrame(resize);
})();
</script>
</body>
</html>
