<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Classification of matter</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div>
        <p class="kicker" id="header-kicker">Planet Earth</p>
        <h1 id="header-title">Classification of matter</h1>
      </div>
      <div class="top-side">
        <div id="hud" class="hud" hidden></div>
        <nav class="nav">
          <button type="button" class="btn btn-ghost" id="btn-home">Home</button>
        </nav>
      </div>
    </div>
  </header>

  <main>
    <section class="view active taiko-select" id="hub">
      <div class="taiko-panel">
        <div class="setup-viewport" id="setup-viewport"></div>
      </div>
    </section>
    <section class="view" id="play"></section>
    <section class="view" id="recap"></section>
  </main>

  <div id="leave-overlay" class="overlay" hidden>
    <div class="overlay-card" role="dialog" aria-modal="true" aria-labelledby="leave-title">
      <p id="leave-title">This dungeon is not finished. Return home?</p>
      <div class="overlay-actions">
        <button type="button" class="btn" id="leave-stay">Stay</button>
        <button type="button" class="btn btn-ghost" id="leave-home">Home</button>
      </div>
    </div>
  </div>

  <canvas id="confetti" aria-hidden="true"></canvas>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
